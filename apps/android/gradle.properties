org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Tencent's official 3.5.19 Lite JAR still references legacy support-v4
# symbols. Jetifier rewrites only that vendored bytecode to AndroidX.
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# The shared Windows workspace contains Chinese characters; AGP otherwise rejects the path.
android.overridePathCheck=true
# The repository is built through an ASCII subst drive on Windows. Incremental
# Kotlin/KAPT state can otherwise mix the real path and the mapped path and
# produce an incomplete final DEX even when Gradle reports success.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kapt.incremental.apt=false
