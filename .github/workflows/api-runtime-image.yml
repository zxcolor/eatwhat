name: Build API runtime image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-runtime-image.yml"
      - ".dockerignore"
      - "apps/api/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "infra/ecs/compose.yml"
      - "infra/ecs/deployment.env.example"
      - "infra/ecs/scripts/preflight-deployment.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-runtime-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: API linux-amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_REF: chi-shen-me-api:git-${{ github.sha }}

    steps:
      - name: Enforce main source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deployment image artifacts may only be built from main."
            exit 1
          fi

      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build ordinary API runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --target runtime \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_REF" \
            --file apps/api/Dockerfile \
            .

      - name: Verify image contract
        id: inspect
        shell: bash
        run: |
          set -euo pipefail

          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")"
          image_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"

          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$platform" == "linux/amd64" ]]
          [[ "$image_user" == "node" ]]
          [[ "$revision" == "$GITHUB_SHA" ]]

          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint sh \
            "$IMAGE_REF" -eu -c '
              test "$(id -u)" -ne 0
              test -r /app/dist/main.js
              test -r /app/dist/auth/auth-config.js
              test -r /app/dist/database/migrate-cli.js
              test -r /app/migrations/0001_initial_schema.sql
            '

          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "image_user=$image_user" >> "$GITHUB_OUTPUT"

      - name: Export, hash and reload image
        id: package
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.inspect.outputs.image_id }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p dist
          archive="chi-shen-me-api-${GITHUB_SHA}-linux-amd64.tar.gz"

          docker image save "$IMAGE_REF" |
            gzip -n -9 > "dist/$archive"

          (
            cd dist
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check --strict "$archive.sha256"
          )

          docker image rm "$IMAGE_REF"
          gzip -dc "dist/$archive" | docker image load >/tmp/api-image-load.log

          reloaded_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          reloaded_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")"
          reloaded_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")"
          reloaded_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"

          [[ "$reloaded_id" == "$EXPECTED_IMAGE_ID" ]]
          [[ "$reloaded_platform" == "linux/amd64" ]]
          [[ "$reloaded_user" == "node" ]]
          [[ "$reloaded_revision" == "$GITHUB_SHA" ]]

          archive_sha256="$(cut -d ' ' -f 1 "dist/$archive.sha256")"

          printf 'API_IMAGE=%s\nAPI_IMAGE_ID=%s\n' \
            "$IMAGE_REF" "$EXPECTED_IMAGE_ID" \
            > dist/deployment-image.env

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg image "$IMAGE_REF" \
            --arg imageId "$EXPECTED_IMAGE_ID" \
            --arg platform "$reloaded_platform" \
            --arg user "$reloaded_user" \
            --arg archive "$archive" \
            --arg archiveSha256 "$archive_sha256" \
            '{
              schemaVersion: 1,
              repository: $repository,
              commit: $commit,
              ref: $ref,
              workflowRunUrl: $runUrl,
              image: $image,
              imageId: $imageId,
              platform: $platform,
              user: $user,
              archive: $archive,
              archiveSha256: $archiveSha256
            }' > dist/image-metadata.json

          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4 ]]

          echo "archive_name=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload short-lived candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: api-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/${{ steps.package.outputs.archive_name }}
            dist/${{ steps.package.outputs.archive_name }}.sha256
            dist/deployment-image.env
            dist/image-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: false

      - name: Record audit summary
        shell: bash
        env:
          IMAGE_ID: ${{ steps.inspect.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### API runtime image candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Docker image ID: \`$IMAGE_ID\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Runtime user: \`node\`"
            echo "- tar.gz SHA-256: \`$ARCHIVE_SHA256\`"
            echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo
            echo "Candidate only: deploy only after the same main SHA has fully green CI."
          } >> "$GITHUB_STEP_SUMMARY"
