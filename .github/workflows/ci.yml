name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: chi_shen_me_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chi_shen_me_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and PostgreSQL client
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Bootstrap extensions and isolated least-privilege roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
          PGUSER: postgres
          PGPASSWORD: ci-bootstrap-password
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE schema_migrator LOGIN PASSWORD 'ci-migrator-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE api_runtime LOGIN PASSWORD 'ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE retention_worker LOGIN PASSWORD 'ci-maintenance-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE admin_api_runtime LOGIN PASSWORD 'ci-admin-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE data_export_worker LOGIN PASSWORD 'ci-export-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER SCHEMA public OWNER TO schema_migrator;
          GRANT CONNECT ON DATABASE chi_shen_me_ci
            TO schema_migrator, api_runtime, retention_worker, admin_api_runtime,
               data_export_worker;
          SQL
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -f infra/postgres/bootstrap-extensions.sql
      - name: Migrate an empty database and prove idempotency
        env:
          NODE_ENV: test
          DATABASE_MIGRATION_URL: postgresql://schema_migrator:ci-migrator-password@127.0.0.1:5432/chi_shen_me_ci
          DATABASE_MIGRATION_SSL_MODE: disable
        run: |
          pnpm --filter @chi-shen-me/api build
          node apps/api/dist/database/migrate-cli.js
          node apps/api/dist/database/migrate-cli.js
      - name: Apply role grants atomically and test deployment failure gates
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
        run: |
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          if psql -X -f infra/postgres/role-grants.sql >/tmp/missing-role.log 2>&1; then
            echo "role grant script accepted missing variables" >&2
            exit 1
          fi
          if psql -X -v migration_owner=schema_migrator \
            -v runtime_role=missing_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql >/tmp/invalid-role.log 2>&1; then
            echo "role grant script accepted an unknown role" >&2
            exit 1
          fi
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          psql -X -v ON_ERROR_STOP=1 -c \
            "GRANT UPDATE (destination_hash) ON public.otp_challenges TO api_runtime"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          test "$(psql -X -At -c "SELECT has_column_privilege('api_runtime','public.otp_challenges','destination_hash','UPDATE')")" = "f"
          test "$(psql -X -At -c "SELECT has_table_privilege('api_runtime','public.users','SELECT')")" = "t"
          sed 's/public.coverage_areas/public.deliberately_missing_relation/' \
            infra/postgres/role-grants.sql >/tmp/failing-role-grants.sql
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          if psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f /tmp/failing-role-grants.sql >/tmp/mid-grant.log 2>&1; then
            echo "deliberately broken role grant script unexpectedly succeeded" >&2
            exit 1
          fi
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          test "$(psql -X -At -c "SELECT has_table_privilege('api_runtime','public.users','SELECT')")" = "t"
      - name: Exercise fenced data export delivery and least-privilege ACLs
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
        run: |
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          for role in api_runtime retention_worker admin_api_runtime data_export_worker; do
            test "$(psql -X -At -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER']) AS checked(privilege_name) WHERE has_table_privilege('$role','public.data_export_jobs',privilege_name)")" = "0"
            test "$(psql -X -At -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','REFERENCES']) AS checked(privilege_name) WHERE has_any_column_privilege('$role','public.data_export_jobs',privilege_name)")" = "0"
          done
          test "$(psql -X -At -c "SELECT has_function_privilege('api_runtime','public.app_queue_data_export(uuid,uuid,boolean)','EXECUTE')")" = "t"
          test "$(psql -X -At -c "SELECT has_function_privilege('api_runtime','public.app_open_data_export_artifact(uuid,uuid)','EXECUTE')")" = "t"
          test "$(psql -X -At -c "SELECT has_function_privilege('api_runtime','public.export_build_safe_snapshot(uuid,character varying,character varying)','EXECUTE')")" = "f"
          test "$(psql -X -At -c "SELECT has_function_privilege('data_export_worker','public.export_build_safe_snapshot(uuid,character varying,character varying)','EXECUTE')")" = "t"
          test "$(psql -X -At -c "SELECT has_function_privilege('data_export_worker','public.app_open_data_export_artifact(uuid,uuid)','EXECUTE')")" = "f"
          test "$(psql -X -At -c "SELECT has_function_privilege('retention_worker','public.export_build_safe_snapshot(uuid,character varying,character varying)','EXECUTE')")" = "f"
          test "$(psql -X -At -c "SELECT has_function_privilege('admin_api_runtime','public.export_build_safe_snapshot(uuid,character varying,character varying)','EXECUTE')")" = "f"
          test "$(psql -X -At -c "SELECT has_table_privilege('data_export_worker','public.schema_migrations','SELECT')")" = "t"
          test "$(psql -X -At -c "SELECT has_table_privilege('data_export_worker','public.users','SELECT')")" = "f"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.users (id)
            VALUES
              ('13000000-0000-4000-8000-000000000001'),
              ('13500000-0000-4000-8000-000000000001'),
              ('13800000-0000-4000-8000-000000000001');
          INSERT INTO public.identity_bindings (
            id, user_id, identity_type, lookup_hash, lookup_hash_algorithm,
            lookup_hash_key_version, dedup_hash, dedup_hash_algorithm,
            dedup_hash_key_version, masked_display_hint, is_primary, verified_at
          ) VALUES (
            '13100000-0000-4000-8000-000000000001',
            '13000000-0000-4000-8000-000000000001', 'PHONE',
            '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef',
            'HMAC-SHA256', 'ci-v1',
            'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210',
            'HMAC-SHA256', 'ci-v1',
            '+86130****0001', true, now()
          );
          INSERT INTO public.recommendation_history (
            id, user_id, request_correlation_hash, hash_key_version,
            event_type, meal_period, occurred_at, retain_until
          ) VALUES
            ('14100000-0000-4000-8000-000000000001',
             '13000000-0000-4000-8000-000000000001', repeat('1',64), 'ci-v1',
             'DETAIL', 'LUNCH', now(), now() + interval '90 days'),
            ('14200000-0000-4000-8000-000000000001',
             '13500000-0000-4000-8000-000000000001', repeat('2',64), 'ci-v1',
             'NAVIGATION', 'DINNER', now(), now() + interval '90 days');
          ALTER TABLE public.recommendation_history
            DISABLE TRIGGER recommendation_history_fresh_event;
          INSERT INTO public.recommendation_history (
            id, user_id, request_correlation_hash, hash_key_version,
            event_type, meal_period, occurred_at, retain_until
          ) VALUES
            ('14300000-0000-4000-8000-000000000001',
             '13000000-0000-4000-8000-000000000001', repeat('3',64), 'ci-v1',
             'IMPRESSION', 'BREAKFAST', now() - interval '91 days',
             now() - interval '1 day'),
            ('14400000-0000-4000-8000-000000000001',
             '13500000-0000-4000-8000-000000000001', repeat('4',64), 'ci-v1',
             'REROLL', 'LUNCH', now() - interval '91 days',
             now() - interval '1 day');
          ALTER TABLE public.recommendation_history
            ENABLE TRIGGER recommendation_history_fresh_event;
          ALTER TABLE public.support_feedback
            DISABLE TRIGGER support_feedback_initial_state;
          INSERT INTO public.support_feedback (
            id, user_id, category, content_ciphertext, encryption_key_version,
            status, created_at, closed_at, retain_until, submitter_kind
          ) VALUES (
            '14500000-0000-4000-8000-000000000001',
            '13000000-0000-4000-8000-000000000001', 'PRODUCT',
            decode(repeat('cd',16),'hex'), 'enc-v1', 'CLOSED',
            now() - interval '200 days', now() - interval '181 days',
            now() - interval '1 day', 'LEGACY'
          );
          ALTER TABLE public.support_feedback
            ENABLE TRIGGER support_feedback_initial_state;
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -c "SELECT public.submit_support_feedback('13200000-0000-4000-8000-000000000001','13000000-0000-4000-8000-000000000001','ACCOUNT','PRIVACY',decode(repeat('ab',16),'hex'),'enc-v1',repeat('3',64),'ci-v1',jsonb_build_object('ci-v1',repeat('3',64)),NULL,NULL,NULL)")" = "INSERTED"
          test "$(psql -X -At -F '|' -c "SELECT outcome,export_status,include_behavior_history FROM public.app_queue_data_export('13000000-0000-4000-8000-000000000001','13300000-0000-4000-8000-000000000001',false)")" = "CREATED|QUEUED|f"
          if psql -X -c "SELECT * FROM public.data_export_jobs" >/tmp/runtime-export-base-read.log 2>&1; then
            echo "API runtime can read export base rows" >&2
            exit 1
          fi
          if psql -X -c "UPDATE public.data_export_jobs SET artifact_locator_ciphertext=decode(repeat('ff',16),'hex') WHERE id='13300000-0000-4000-8000-000000000001'" >/tmp/runtime-export-stage-write.log 2>&1; then
            echo "API runtime can directly stage an export locator" >&2
            exit 1
          fi
          test "$(psql -X -At -c "SELECT has_function_privilege('api_runtime','public.export_artifact_required_locator_key_versions()','EXECUTE')")" = "f"
          export PGUSER=data_export_worker PGPASSWORD=ci-export-worker-password
          if psql -X -c "SELECT * FROM public.users" >/tmp/export-worker-user-read.log 2>&1; then
            echo "export worker can read user base rows" >&2
            exit 1
          fi
          if psql -X -c "SELECT * FROM public.support_feedback" >/tmp/export-worker-feedback-read.log 2>&1; then
            echo "export worker can read support feedback base rows" >&2
            exit 1
          fi
          test "$(psql -X -At -c "SELECT has_function_privilege('data_export_worker','public.export_artifact_required_locator_key_versions()','EXECUTE')")" = "t"
          test "$(psql -X -At -c "SELECT has_function_privilege('data_export_worker','public.support_feedback_required_key_versions()','EXECUTE')")" = "t"
          test "$(psql -X -At -c "SELECT count(*) FROM public.support_feedback_required_key_versions() WHERE key_purpose='ENCRYPTION' AND key_version='enc-v1'")" = "1"
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.export_claim_next_job(
            repeat('a',64), 'ci-worker-v1', 300
          ) \gset
          \if :{?export_id}
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: export worker did not claim the queued job'; END $ci_fail$;
          \endif
          SELECT * FROM public.export_stage_job_artifact(
            :'export_id'::uuid, repeat('a',64), 'ci-worker-v1',
            :state_version::bigint, decode(repeat('ab',16),'hex'),
            'ci-artifact-v1', repeat('b',64), 128, 'application/json'
          ) \gset
          \if :{?new_state_version}
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: export worker did not stage the artifact'; END $ci_fail$;
          \endif
          SELECT count(*) = 1 AS locator_key_version_visible
          FROM public.export_artifact_required_locator_key_versions()
          WHERE key_version = 'ci-artifact-v1' \gset
          \if :locator_key_version_visible
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: artifact locator key version is not visible'; END $ci_fail$;
          \endif
          DO $$
          DECLARE snapshot jsonb;
          BEGIN
            snapshot := public.export_build_safe_snapshot(
              '13300000-0000-4000-8000-000000000001',
              repeat('a',64), 'ci-worker-v1'
            );
            IF jsonb_object_length(snapshot) <> 9
              OR NOT snapshot ?& ARRAY[
                'schemaVersion','generatedAt','account','identities','favorites',
                'recommendationHistory','privateFeedback','preferences',
                'supportFeedbackEncrypted'
              ]
              OR snapshot ->> 'schemaVersion' <> '1'
              OR jsonb_array_length(snapshot -> 'identities') <> 1
              OR jsonb_array_length(snapshot -> 'favorites') <> 0
              OR jsonb_array_length(snapshot -> 'recommendationHistory') <> 0
              OR jsonb_array_length(snapshot -> 'privateFeedback') <> 0
              OR snapshot -> 'preferences' <> '{}'::jsonb
              OR jsonb_array_length(snapshot -> 'supportFeedbackEncrypted') <> 1
              OR length(snapshot #>> '{supportFeedbackEncrypted,0,ciphertextBase64}')
                   NOT BETWEEN 24 AND 87384
              OR snapshot::text ~* '(providerCode|providerPlaceId|lookupHash|dedupHash|requestCorrelationHash|contentFingerprint|guestIpHash|accessToken|refreshToken|coordinate)'
            THEN
              RAISE EXCEPTION 'unsafe or invalid export snapshot';
            END IF;
          END $$;
          SELECT count(*) = 0 AS stale_rejected
          FROM public.export_complete_job(
            :'export_id'::uuid, repeat('a',64), 'ci-worker-v1',
            :state_version::bigint
          ) \gset
          \if :stale_rejected
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: stale export completion was not rejected'; END $ci_fail$;
          \endif
          SELECT count(*) = 1 AS completed
          FROM public.export_complete_job(
            :'export_id'::uuid, repeat('a',64), 'ci-worker-v1',
            :new_state_version::bigint
          ) \gset
          \if :completed
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: export job did not complete'; END $ci_fail$;
          \endif
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -F '|' -c "SELECT export_status,include_behavior_history,artifact_size_bytes,artifact_sha256 FROM public.app_get_data_export_status('13000000-0000-4000-8000-000000000001','13300000-0000-4000-8000-000000000001')")" = "READY|f|128|bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          test "$(psql -X -At -c "SELECT count(*) FROM public.app_open_data_export_artifact('13000000-0000-4000-8000-000000000001','13300000-0000-4000-8000-000000000001')")" = "1"
          test "$(psql -X -At -c "SELECT count(*) FROM public.app_open_data_export_artifact('13000000-0000-4000-8000-000000000099','13300000-0000-4000-8000-000000000001')")" = "0"
          test "$(psql -X -At -c "SELECT public.begin_account_deletion('13000000-0000-4000-8000-000000000001','13400000-0000-4000-8000-000000000001',repeat('c',64),'ci-v1',now()+interval '1 day')")" = "t"
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT has_function_privilege('retention_worker','public.export_artifact_required_locator_key_versions()','EXECUTE')")" = "f"
          test "$(psql -X -At -c "SELECT public.complete_account_deletion('13400000-0000-4000-8000-000000000001','13000000-0000-4000-8000-000000000001')")" = "f"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE public.data_export_jobs DISABLE TRIGGER data_export_job_state_machine;
          UPDATE public.data_export_jobs
          SET created_at = now() - interval '8 days',
              expires_at = now() - interval '1 day',
              ready_at = now() - interval '2 days',
              completed_at = now() - interval '2 days'
          WHERE id = '13300000-0000-4000-8000-000000000001';
          ALTER TABLE public.data_export_jobs ENABLE TRIGGER data_export_job_state_machine;
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -c "SELECT count(*) FROM public.app_open_data_export_artifact('13000000-0000-4000-8000-000000000001','13300000-0000-4000-8000-000000000001')")" = "0"
          export PGUSER=data_export_worker PGPASSWORD=ci-export-worker-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.export_claim_next_artifact_deletion(
            repeat('d',64), 'ci-worker-v1', 300
          ) \gset
          \if :{?export_id}
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: completed artifact was not claimed for deletion'; END $ci_fail$;
          \endif
          SELECT count(*) = 1 AS artifact_marked
          FROM public.export_mark_artifact_deleted(
            :'export_id'::uuid, repeat('d',64), 'ci-worker-v1',
            :state_version::bigint
          ) \gset
          \if :artifact_marked
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: completed artifact was not marked deleted'; END $ci_fail$;
          \endif
          SQL
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT public.complete_account_deletion('13400000-0000-4000-8000-000000000001','13000000-0000-4000-8000-000000000001')")" = "t"
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -c "SELECT outcome FROM public.app_queue_data_export('13500000-0000-4000-8000-000000000001','13600000-0000-4000-8000-000000000001',true)")" = "CREATED"
          export PGUSER=data_export_worker PGPASSWORD=ci-export-worker-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.export_claim_next_job(
            repeat('e',64), 'ci-worker-v1', 300
          ) \gset
          SELECT * FROM public.export_stage_job_artifact(
            :'export_id'::uuid, repeat('e',64), 'ci-worker-v1',
            :state_version::bigint, decode(repeat('cd',16),'hex'),
            'ci-artifact-v1', repeat('c',64), 256, 'application/json'
          ) \gset
          \if :{?new_state_version}
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: lease-recovery artifact staging returned no state'; END $ci_fail$;
          \endif
          DO $$
          DECLARE snapshot jsonb;
          BEGIN
            snapshot := public.export_build_safe_snapshot(
              '13600000-0000-4000-8000-000000000001',
              repeat('e',64), 'ci-worker-v1'
            );
            IF jsonb_array_length(snapshot -> 'recommendationHistory') <> 1
              OR snapshot #>> '{recommendationHistory,0,action}' <> 'NAVIGATION'
            THEN
              RAISE EXCEPTION 'active behavior history was not exported exactly once';
            END IF;
          END $$;
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -c "SELECT public.begin_account_deletion('13500000-0000-4000-8000-000000000001','13700000-0000-4000-8000-000000000001',repeat('f',64),'ci-v1',now()+interval '1 day')")" = "t"
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT public.complete_account_deletion('13700000-0000-4000-8000-000000000001','13500000-0000-4000-8000-000000000001')")" = "f"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE public.data_export_jobs DISABLE TRIGGER data_export_job_state_machine;
          UPDATE public.data_export_jobs
            SET lease_expires_at = now() - interval '1 second'
            WHERE id = '13600000-0000-4000-8000-000000000001';
          ALTER TABLE public.data_export_jobs ENABLE TRIGGER data_export_job_state_machine;
          SQL
          export PGUSER=data_export_worker PGPASSWORD=ci-export-worker-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.export_claim_next_artifact_deletion(
            repeat('f',64), 'ci-worker-v1', 300
          ) \gset
          \if :{?export_id}
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: staged orphan was not claimed for deletion'; END $ci_fail$;
          \endif
          SELECT count(*) = 1 AS staged_orphan_marked
          FROM public.export_mark_artifact_deleted(
            :'export_id'::uuid, repeat('f',64), 'ci-worker-v1',
            :state_version::bigint
          ) \gset
          \if :staged_orphan_marked
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: staged orphan was not marked deleted'; END $ci_fail$;
          \endif
          SQL
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT public.complete_account_deletion('13700000-0000-4000-8000-000000000001','13500000-0000-4000-8000-000000000001')")" = "t"
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          test "$(psql -X -At -c "SELECT outcome FROM public.app_queue_data_export('13800000-0000-4000-8000-000000000001','13900000-0000-4000-8000-000000000001',true)")" = "CREATED"
          export PGUSER=data_export_worker PGPASSWORD=ci-export-worker-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
