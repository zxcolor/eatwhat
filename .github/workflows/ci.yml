            repeat('6',64),'10000000-0000-0000-0000-000000000001',repeat('7',64),
            repeat('c',64),'ci-v1',repeat('d',64),'ci-dedup-v1'
          );
          DO $$
          DECLARE bound_id uuid;
          BEGIN
            IF public.bind_email_identity_from_consumed_otp(
              '10000000-0000-0000-0000-000000000003',
              '30000000-0000-0000-0000-000000000003',repeat('6',64),repeat('7',64)
            ) IS NOT NULL THEN RAISE EXCEPTION 'email proof crossed user boundary'; END IF;
            bound_id := public.bind_email_identity_from_consumed_otp(
              '10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000003',repeat('6',64),repeat('7',64)
            );
            IF bound_id IS NULL OR NOT EXISTS (
              SELECT 1 FROM public.identity_bindings WHERE id=bound_id
                AND lookup_hash=repeat('a',64) AND dedup_hash=repeat('b',64)
            ) THEN RAISE EXCEPTION 'sealed email proof was not bound'; END IF;
            IF public.bind_email_identity_from_consumed_otp(
              '10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000003',repeat('6',64),repeat('7',64)
            ) IS NOT NULL THEN RAISE EXCEPTION 'email proof replayed'; END IF;
            IF public.bind_qq_identity_from_consumed_oauth_state(
              '10000000-0000-0000-0000-000000000003',
              '40000000-0000-0000-0000-000000000003',repeat('8',64),repeat('6',64),repeat('7',64)
            ) IS NOT NULL THEN RAISE EXCEPTION 'QQ proof crossed user boundary'; END IF;
            bound_id := public.bind_qq_identity_from_consumed_oauth_state(
              '10000000-0000-0000-0000-000000000001',
              '40000000-0000-0000-0000-000000000003',repeat('8',64),repeat('6',64),repeat('7',64)
            );
            IF bound_id IS NULL OR NOT EXISTS (
              SELECT 1 FROM public.identity_bindings WHERE id=bound_id
                AND lookup_hash=repeat('c',64) AND dedup_hash=repeat('d',64)
            ) THEN RAISE EXCEPTION 'sealed QQ proof was not bound'; END IF;
            IF public.bind_qq_identity_from_consumed_oauth_state(
              '10000000-0000-0000-0000-000000000001',
              '40000000-0000-0000-0000-000000000003',repeat('8',64),repeat('6',64),repeat('7',64)
            ) IS NOT NULL THEN RAISE EXCEPTION 'QQ proof replayed'; END IF;
          END $$;
          INSERT INTO public.auth_session_families (
            id, user_id, device_label, platform, device_hash, hash_key_version,
            refresh_expires_at, retain_until
          ) VALUES (
            '50000000-0000-0000-0000-000000000001',
            '10000000-0000-0000-0000-000000000001', 'CI Android', 'ANDROID',
            repeat('9',64), 'ci-v1', now() + interval '1 day', now() + interval '2 days'
          );
          INSERT INTO public.auth_refresh_credentials (
            id, session_family_id, generation, token_hash, token_hash_algorithm,
            token_hash_key_version, expires_at
          ) VALUES
            ('60000000-0000-0000-0000-000000000001', '50000000-0000-0000-0000-000000000001', 0, repeat('a',64), 'HMAC-SHA256', 'ci-v1', now() + interval '12 hours'),
            ('60000000-0000-0000-0000-000000000002', '50000000-0000-0000-0000-000000000001', 1, repeat('b',64), 'HMAC-SHA256', 'ci-v1', now() + interval '12 hours');
          SELECT public.rotate_auth_refresh_credential(
            '60000000-0000-0000-0000-000000000001',
            '50000000-0000-0000-0000-000000000001',
            '60000000-0000-0000-0000-000000000002'
          ) AS rotated \gset
          SELECT public.mark_auth_refresh_replay(
            '50000000-0000-0000-0000-000000000001',
            '60000000-0000-0000-0000-000000000001'
          ) AS compromised \gset
          \if :rotated
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: refresh credential did not rotate'; END $ci_fail$;
          \endif
          \if :compromised
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: refresh replay did not compromise the session family'; END $ci_fail$;
          \endif
          SQL
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id AS email_binding_id FROM public.identity_bindings
            WHERE user_id='10000000-0000-0000-0000-000000000001'
              AND identity_type='EMAIL' AND revoked_at IS NULL \gset
          SELECT public.revoke_non_primary_identity_binding(
            :'email_binding_id','10000000-0000-0000-0000-000000000001'
          ) AS email_revoked \gset
          \if :email_revoked
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: non-primary email binding was not revoked'; END $ci_fail$;
          \endif
          INSERT INTO public.otp_challenges (
            id, channel, purpose, destination_hash, destination_hash_algorithm,
            destination_hash_key_version, destination_dedup_hash,
            destination_dedup_hash_algorithm, destination_dedup_key_version,
            masked_destination, operation_target_hash, target_user_id, code_hash,
            code_hash_algorithm, code_hash_key_version, idempotency_key_hash,
            hash_key_version, request_ip_hash, device_hash, retain_until
          ) VALUES (
            '30000000-0000-0000-0000-000000000004','EMAIL','BIND',repeat('e',64),
            'HMAC-SHA256','ci-v1',repeat('b',64),'HMAC-SHA256','ci-dedup-v1',
            'a***@example.com',repeat('1',64),'10000000-0000-0000-0000-000000000001',
            repeat('r',64),'ARGON2ID-PEPPERED','ci-v1',repeat('0',64),'ci-v1',
            repeat('8',64),repeat('2',64),now()+interval '1 hour'
          );
          SELECT public.finalize_otp_delivery(
            '30000000-0000-0000-0000-000000000004','SENT',repeat('3',64),now()+interval '10 minutes'
          ) AS recovery_delivered \gset
          SELECT public.record_otp_verification_attempt(
            '30000000-0000-0000-0000-000000000004','BIND',
            '10000000-0000-0000-0000-000000000001',repeat('1',64),repeat('2',64),true
          ) AS recovery_consumed \gset
          \if :recovery_delivered
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: recovery OTP delivery was not recorded'; END $ci_fail$;
          \endif
          \if :recovery_consumed
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: recovery OTP was not consumed'; END $ci_fail$;
          \endif
          DO $$
          DECLARE target_binding_id uuid;
          BEGIN
            SELECT id INTO target_binding_id FROM public.identity_bindings
              WHERE user_id='10000000-0000-0000-0000-000000000001'
                AND identity_type='EMAIL';
            IF target_binding_id IS NULL THEN
              RAISE EXCEPTION 'email binding fixture is missing';
            END IF;
            IF public.reactivate_phone_email_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000003',
              '30000000-0000-0000-0000-000000000004',repeat('1',64),repeat('2',64)
            ) THEN RAISE EXCEPTION 'reactivation proof crossed user boundary'; END IF;
            IF public.reactivate_phone_email_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000004',repeat('9',64),repeat('2',64)
            ) THEN RAISE EXCEPTION 'reactivation accepted wrong operation target'; END IF;
            IF public.reactivate_phone_email_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000004',repeat('1',64),repeat('9',64)
            ) THEN RAISE EXCEPTION 'reactivation accepted wrong device'; END IF;
            IF NOT public.reactivate_phone_email_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000004',repeat('1',64),repeat('2',64)
            ) THEN RAISE EXCEPTION 'valid reactivation proof was rejected'; END IF;
            IF NOT public.revoke_non_primary_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000001'
            ) THEN RAISE EXCEPTION 'reactivated email could not be revoked'; END IF;
            IF public.reactivate_phone_email_identity_binding(
              target_binding_id,'10000000-0000-0000-0000-000000000001',
              '30000000-0000-0000-0000-000000000004',repeat('1',64),repeat('2',64)
            ) THEN RAISE EXCEPTION 'claimed reactivation proof replayed'; END IF;
            IF EXISTS (
              SELECT 1 FROM public.identity_bindings
              WHERE id=target_binding_id AND revoked_at IS NULL
            ) OR NOT EXISTS (
              SELECT 1 FROM public.otp_challenges
              WHERE id='30000000-0000-0000-0000-000000000004'
                AND binding_claimed_at IS NOT NULL
            ) THEN RAISE EXCEPTION 'reactivation replay state was not preserved'; END IF;
          END $$;
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          if psql -X -c "UPDATE public.oauth_states SET consumed_at=NULL WHERE id='40000000-0000-0000-0000-000000000001'" >/tmp/direct-oauth.log 2>&1; then
            echo "runtime role can directly reset OAuth state" >&2
            exit 1
          fi
          if psql -X -c "INSERT INTO public.users (id) VALUES ('10000000-0000-0000-0000-000000000004')" >/tmp/direct-user.log 2>&1; then
            echo "runtime role can bypass atomic registration" >&2
            exit 1
          fi
          if psql -X -c "SELECT public.claim_phone_wechat_registration_flow('30000000-0000-0000-0000-000000000002','40000000-0000-0000-0000-000000000002',repeat('f',64),repeat('e',64))" >/tmp/direct-registration-claim.log 2>&1; then
            echo "runtime role can claim registration proofs without creating the account" >&2
            exit 1
          fi
          if psql -X -c "SELECT public.reactivate_phone_email_identity_binding('00000000-0000-0000-0000-000000000000','10000000-0000-0000-0000-000000000001','30000000-0000-0000-0000-000000000004',repeat('1',64),repeat('2',64))" >/tmp/direct-reactivation.log 2>&1; then
            echo "runtime role can call legacy identity reactivation directly" >&2
            exit 1
          fi
          if psql -X -c "UPDATE public.auth_refresh_credentials SET consumed_at=NULL WHERE id='60000000-0000-0000-0000-000000000001'" >/tmp/direct-refresh.log 2>&1; then
            echo "runtime role can directly reset refresh credentials" >&2
            exit 1
          fi
          if psql -X -c "INSERT INTO public.auth_access_tokens (session_family_id,token_hash,token_hash_algorithm,token_hash_key_version,expires_at,retain_until) VALUES ('50000000-0000-0000-0000-000000000001',repeat('c',64),'HMAC-SHA256','ci-v1',now()+interval '10 minutes',now()+interval '1 hour')" >/tmp/compromised-issue.log 2>&1; then
            echo "runtime role issued a token for a compromised family" >&2
            exit 1
          fi
          test "$(psql -X -At -c "SELECT public.data_rights_authorization_allows('20000000-0000-0000-0000-000000000001','AMAP','PERSIST_PLACE_REFERENCE')")" = "t"
          test "$(psql -X -At -c "SELECT public.data_rights_authorization_allows('20000000-0000-0000-0000-000000000001','BAIDU','PERSIST_PLACE_REFERENCE')")" = "f"
          test "$(psql -X -At -c "SELECT public.data_rights_authorization_allows('20000000-0000-0000-0000-000000000001',NULL,'PERSIST_PLACE_REFERENCE')")" = "f"
          test "$(psql -X -At -c "SELECT public.data_rights_authorization_allows('20000000-0000-0000-0000-000000000001',NULL,'UNLISTED_OPERATION')")" = "f"
      - name: Exercise expiration, concurrency, revocation and cleanup gates
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
        run: |
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.data_rights_authorizations (
            id, provider_code, authorization_reference_hash,
            reference_hash_algorithm, reference_hash_key_version,
            evidence_locator_ciphertext, encryption_key_version,
            effective_at, expires_at, reviewed_by_admin_user_hash,
            reviewer_hash_key_version
          ) VALUES
            ('20000000-0000-0000-0000-000000000002','AMAP',repeat('c',64),'HMAC-SHA256','ci-v1',decode(repeat('cd',16),'hex'),'ci-v1',now()-interval '1 hour',now()+interval '8 seconds',repeat('d',64),'ci-v1'),
            ('20000000-0000-0000-0000-000000000003','AMAP',repeat('e',64),'HMAC-SHA256','ci-v1',decode(repeat('ef',16),'hex'),'ci-v1',now()-interval '1 hour',now()+interval '1 day',repeat('f',64),'ci-v1');
          INSERT INTO public.data_rights_authorization_operations
            (authorization_id, operation_code)
          VALUES
            ('20000000-0000-0000-0000-000000000002','PERSIST_PLACE_REFERENCE'),
            ('20000000-0000-0000-0000-000000000003','PERSIST_PLACE_REFERENCE');
          SQL
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          expired_ref=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT public.persist_licensed_external_place_reference('AMAP','short-lived','20000000-0000-0000-0000-000000000002',now()+interval '6 seconds')")
          psql -X -At -v ON_ERROR_STOP=1 -c "SELECT public.persist_licensed_external_place_reference('AMAP','concurrent','20000000-0000-0000-0000-000000000003',now()+interval '1 hour')" >/tmp/ref-one &
          first_pid=$!
          psql -X -At -v ON_ERROR_STOP=1 -c "SELECT public.persist_licensed_external_place_reference('AMAP','concurrent','20000000-0000-0000-0000-000000000003',now()+interval '2 hours')" >/tmp/ref-two &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          test "$(cat /tmp/ref-one)" = "$(cat /tmp/ref-two)"
          sleep 9
          if psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.recommendation_history (user_id,external_place_reference_id,request_correlation_hash,hash_key_version,event_type,meal_period,occurred_at,retain_until) VALUES ('10000000-0000-0000-0000-000000000001','$expired_ref',repeat('d',64),'ci-v1','DETAIL','LUNCH',now()-interval '1 hour',now()+interval '89 days')" >/tmp/backdated.log 2>&1; then
            echo "backdated event reused an expired authorization" >&2
            exit 1
          fi
          if psql -X -c "SELECT public.persist_licensed_external_place_reference('AMAP','short-lived','20000000-0000-0000-0000-000000000002',now()+interval '1 hour')" >/tmp/revive.log 2>&1; then
            echo "expired provider reference was revived" >&2
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL' >/tmp/persist-race.log &
          BEGIN;
          SELECT public.persist_licensed_external_place_reference(
            'AMAP','revoke-race','20000000-0000-0000-0000-000000000003',now()+interval '2 hours'
          );
          SELECT pg_sleep(2);
          COMMIT;
          SQL
          persist_pid=$!
          sleep 1
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 -c "SELECT public.revoke_data_rights_authorization('20000000-0000-0000-0000-000000000003',repeat('1',64),'ci-v1')" >/tmp/revoke-race.log &
          revoke_pid=$!
          wait "$persist_pid"
          wait "$revoke_pid"
          test "$(psql -X -At -c "SELECT count(*) FROM public.external_place_references WHERE authorization_id='20000000-0000-0000-0000-000000000003'")" = "0"
          export PGUSER=api_runtime PGPASSWORD=ci-runtime-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.auth_session_families (
            id, user_id, device_label, platform, device_hash, hash_key_version,
            refresh_expires_at, retain_until
          ) VALUES (
            '50000000-0000-0000-0000-000000000002',
            '10000000-0000-0000-0000-000000000003', 'Deletion test', 'ANDROID',
            repeat('4',64), 'ci-v1', now()+interval '1 day', now()+interval '2 days'
          );
          INSERT INTO public.auth_refresh_credentials (
            id, session_family_id, generation, token_hash, token_hash_algorithm,
            token_hash_key_version, expires_at
          ) VALUES
            ('60000000-0000-0000-0000-000000000003','50000000-0000-0000-0000-000000000002',0,repeat('d',64),'HMAC-SHA256','ci-v1',now()+interval '12 hours'),
            ('60000000-0000-0000-0000-000000000004','50000000-0000-0000-0000-000000000002',1,repeat('e',64),'HMAC-SHA256','ci-v1',now()+interval '12 hours');
          SELECT public.rotate_auth_refresh_credential(
            '60000000-0000-0000-0000-000000000003',
            '50000000-0000-0000-0000-000000000002',
            '60000000-0000-0000-0000-000000000004'
          ) AS deletion_family_rotated \gset
          \if :deletion_family_rotated
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: deletion session family did not rotate'; END $ci_fail$;
          \endif
          SELECT public.begin_account_deletion(
            '10000000-0000-0000-0000-000000000003',
            '80000000-0000-0000-0000-000000000001', repeat('5',64),
            'ci-v1', now()+interval '1 day'
          ) AS deletion_started \gset
          \if :deletion_started
          \else
            DO $ci_fail$ BEGIN RAISE EXCEPTION USING MESSAGE = 'CI assertion failed: account deletion did not start'; END $ci_fail$;
          \endif
          SQL
          if psql -X -c "INSERT INTO public.auth_session_families (user_id,device_label,platform,device_hash,hash_key_version,refresh_expires_at,retain_until) VALUES ('10000000-0000-0000-0000-000000000003','late session','ANDROID',repeat('6',64),'ci-v1',now()+interval '1 day',now()+interval '2 days')" >/tmp/deleting-session.log 2>&1; then
            echo "deleting account accepted a new session" >&2
            exit 1
          fi
          if psql -X -c "UPDATE public.users SET status='ACTIVE',disabled_at=NULL,updated_at=now() WHERE id='10000000-0000-0000-0000-000000000003'" >/tmp/reactivate-user.log 2>&1; then
            echo "deleting account was reactivated" >&2
            exit 1
          fi
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT public.complete_account_deletion('80000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000003')")" = "t"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          test "$(psql -X -At -c "SELECT count(*) FROM public.users WHERE id='10000000-0000-0000-0000-000000000003'")" = "0"
          test "$(psql -X -At -c "SELECT count(*) FROM public.identity_bindings WHERE user_id='10000000-0000-0000-0000-000000000003'")" = "0"
          test "$(psql -X -At -c "SELECT count(*) FROM public.account_deletion_jobs WHERE id='80000000-0000-0000-0000-000000000001' AND status='COMPLETED' AND user_id IS NULL")" = "1"
          export NODE_ENV=test
          export DATABASE_MAINTENANCE_URL=postgresql://retention_worker:ci-maintenance-password@127.0.0.1:5432/chi_shen_me_ci
          export DATABASE_MAINTENANCE_SSL_MODE=disable
          node apps/api/dist/database/cleanup-cli.js --dry-run
          node apps/api/dist/database/cleanup-cli.js --execute
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          if psql -X -c "SELECT code_hash FROM public.otp_challenges" >/tmp/maintenance-select.log 2>&1; then
            echo "maintenance role can read OTP hashes" >&2
            exit 1
          fi
      - name: Verify API startup schema check as runtime role
        env:
          NODE_ENV: test
          PORT: "3011"
          DATABASE_ENABLED: "true"
          DATABASE_URL: postgresql://api_runtime:ci-runtime-password@127.0.0.1:5432/chi_shen_me_ci
          DATABASE_SSL_MODE: disable
          ALLOW_DEMO_DATA: "true"
        run: |
          node apps/api/dist/main.js >/tmp/api-runtime.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3011/health >/dev/null; then
              kill "$api_pid"
              wait "$api_pid" || true
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api-runtime.log
          exit 1

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager is missing or not executable at $sdkmanager"
            exit 1
          fi
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify unsigned release fails closed
        shell: bash
        run: |
          if ./gradlew validateReleaseConfiguration \
            -PCHISHENME_API_BASE_URL=https://api.example.invalid/ \
            --no-daemon; then
            echo "Release validation unexpectedly accepted missing signing material" >&2
            exit 1
          fi
