name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify database mutators reject a concurrent mutation
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$PWD"
          sudo env REPOSITORY_ROOT="$repository_root" bash -c '
            set -euo pipefail
            lock_directory=/run/lock/chi-shen-me
            mutation_lock="$lock_directory/mutation.lock"
            if [[ -e "$lock_directory" || -L "$lock_directory" ]]; then
              echo "test lock directory already exists; refusing to alter it" >&2
              exit 1
            fi
            install -d -m 700 "$lock_directory"
            : >"$mutation_lock"
            chmod 600 "$mutation_lock"
            cleanup() {
              chmod 644 "$REPOSITORY_ROOT/infra/ecs/scripts/preflight-deployment.sh" 2>/dev/null || true
              rm -f -- \
                "$lock_directory/postgres-backup.lock" \
                "$lock_directory/postgres-restore.lock" \
                "$lock_directory/postgres-rollback.lock" \
                "$mutation_lock"
              rmdir -- "$lock_directory" 2>/dev/null || true
            }
            trap cleanup EXIT
            chmod 700 "$REPOSITORY_ROOT/infra/ecs/scripts/preflight-deployment.sh"
            exec 9<>"$mutation_lock"
            flock -n 9
            assert_lock_rejected() {
              local script="$1"
              shift
              local output status
              set +e
              output="$(bash "$REPOSITORY_ROOT/$script" "$@" 2>&1)"
              status=$?
              set -e
              [[ "$status" -eq 2 ]] || {
                echo "$script did not reject the held global lock" >&2
                exit 1
              }
              [[ "$output" == "another deployment mutation, backup or secret update is running" ]] || {
                echo "$script reached work beyond the held global lock" >&2
                exit 1
              }
            }
            assert_lock_rejected infra/ecs/scripts/provision-database.sh
            assert_lock_rejected infra/ecs/scripts/restore-database.sh \
              /does/not/exist chi_shen_me_restore_20260828t000000z
            assert_lock_rejected infra/ecs/scripts/rollback-database.sh \
              /does/not/exist --execute WRONG_ORDER_MUST_FAIL
            exec 8>&9
            assert_inherited_lock_reaches_preflight() {
              local script="$1"
              shift
              local output status
              set +e
              output="$(bash "$REPOSITORY_ROOT/$script" "$@" 2>&1)"
              status=$?
              set -e
              [[ "$status" -eq 2 ]] || {
                echo "$script did not reach the expected post-lock preflight rejection" >&2
                exit 1
              }
              [[ "$output" == "unexpected deployment directory: $REPOSITORY_ROOT/infra/ecs" ]] || {
                echo "$script did not accept the inherited global mutation lock" >&2
                exit 1
              }
            }
            assert_inherited_lock_reaches_preflight \
              infra/ecs/scripts/backup-database.sh --mutation-lock-held
            assert_inherited_lock_reaches_preflight \
              infra/ecs/scripts/restore-database.sh \
              /does/not/exist chi_shen_me_restore_20260828t000000z --mutation-lock-held
          '
      - name: Reject legacy authentication retirement before the active bridge
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$PWD"
          sudo env REPOSITORY_ROOT="$repository_root" bash -c '
            set -euo pipefail
            test_root=/opt/chi-shen-me
            lock_directory=/run/lock/chi-shen-me
            private_input=/root/chi-shen-me-auth-wrong-order.env
            if [[ -e "$test_root" || -L "$test_root" || -e "$lock_directory" || -L "$lock_directory" || -e "$private_input" ]]; then
              echo "auth order test path already exists; refusing to alter it" >&2
              exit 1
            fi
            cleanup() {
              rm -f -- "$private_input"
              rm -f -- "$lock_directory/auth-secrets.lock" "$lock_directory/mutation.lock"
              rmdir -- "$lock_directory" 2>/dev/null || true
              [[ "$test_root" == /opt/chi-shen-me ]] && rm -rf -- "$test_root"
            }
            trap cleanup EXIT
            active_release="$test_root/releases/ci-active"
            active_deploy="$active_release/deploy"
            candidate="$test_root/releases/ci-wrong-order/deploy"
            secrets="$test_root/shared/secrets"
            install -d -m 700 "$active_deploy/scripts" "$candidate/scripts" "$secrets"
            install -m 700 "$REPOSITORY_ROOT/infra/ecs/scripts/update-auth-secrets.sh" \
              "$candidate/scripts/update-auth-secrets.sh"
            printf "#!/usr/bin/env bash\nexit 0\n" >"$candidate/scripts/preflight-deployment.sh"
            printf "#!/usr/bin/env bash\nexit 0\n" >"$active_deploy/scripts/verify-runtime.sh"
            chmod 700 "$candidate/scripts/preflight-deployment.sh"
            cat >"$active_deploy/deployment.env" <<"EOF"
          AUTH_SCHEMA_TRANSITION_MODE=none
          EOF
            ln -s "$active_release" "$test_root/current"
            cat >"$candidate/deployment.env" <<"EOF"
          API_IMAGE=registry.example.invalid/chi-shen-me/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SCHEMA_TRANSITION_MODE=none
          ACCOUNTS_ENABLED=false
          PHONE_AUTH_ENABLED=false
          EMAIL_AUTH_ENABLED=false
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          QQ_OPEN_PLATFORM_REALM_ID=eatwhat-qq-primary
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          EOF
            cat >"$secrets/api.env" <<"EOF"
          DATABASE_URL=postgresql://unused.invalid/unused
          ALIYUN_FUSION_SCHEME_CODE=legacy-ci-placeholder
          ALIYUN_FUSION_PACKAGE_NAME=legacy.ci.placeholder
          ALIYUN_FUSION_PACKAGE_SIGN=legacy-ci-placeholder
          WECHAT_APP_ID=legacy-ci-placeholder
          WECHAT_APP_SECRET=legacy-ci-placeholder
          EOF
            cat >"$private_input" <<"EOF"
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=false
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v1
          ALIYUN_PNVS_SIGN_NAME=ci-placeholder
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          EOF
            chown -R root:root "$test_root" "$private_input"
            find "$test_root" -type d -exec chmod 700 {} +
            find "$test_root" -type f -exec chmod 600 {} +
            chmod 600 "$private_input"
            chmod 700 "$active_deploy/scripts/verify-runtime.sh" \
              "$candidate/scripts/update-auth-secrets.sh" "$candidate/scripts/preflight-deployment.sh"
            api_before="$(sha256sum "$secrets/api.env")"
            deployment_before="$(sha256sum "$candidate/deployment.env")"
            assert_auth_order_rejected() {
              local output status
              set +e
              output="$("$candidate/scripts/update-auth-secrets.sh" "$@" 2>&1)"
              status=$?
              set -e
              [[ "$status" -eq 2 ]] || {
                echo "auth updater accepted retirement before bridge activation: $*" >&2
                exit 1
              }
              [[ "$output" == "legacy Fusion, SMS and associated WeChat configuration can only be retired from the active legacy phone drain bridge" ]] || {
                echo "auth updater did not fail at the pre-mutation bridge gate: $*" >&2
                exit 1
              }
              [[ "$(sha256sum "$secrets/api.env")" == "$api_before" ]] || {
                echo "shared api.env changed on rejected auth update: $*" >&2
                exit 1
              }
              [[ "$(sha256sum "$candidate/deployment.env")" == "$deployment_before" ]] || {
                echo "deployment.env changed on rejected auth update: $*" >&2
                exit 1
              }
              ! compgen -G "$secrets/.api.env.*" >/dev/null
              ! compgen -G "$candidate/.deployment.env.*" >/dev/null
            }
            assert_auth_order_rejected --apply --config-file "$private_input"
            assert_auth_order_rejected --disable
          '
      - name: Preserve authentication continuity across email-only and emergency disable
        shell: bash
        run: |
          set -euo pipefail
          repository_root="$PWD"
          sudo env REPOSITORY_ROOT="$repository_root" bash -c '
            set -euo pipefail
            test_root=/opt/chi-shen-me
            lock_directory=/run/lock/chi-shen-me
            same_input=/root/chi-shen-me-auth-continuity-same.env
            changed_input=/root/chi-shen-me-auth-continuity-changed.env
            email_input=/root/chi-shen-me-auth-email-enabled.env
            qq_input=/root/chi-shen-me-auth-qq-enabled.env
            qq_union_input=/root/chi-shen-me-auth-qq-union-enabled.env
            qq_marker_override_input=/root/chi-shen-me-auth-qq-marker-override.env
            qq_missing_key_input=/root/chi-shen-me-auth-qq-missing-key.env
            runtime_password_input=/root/chi-shen-me-auth-email-runtime-password.env
            dual_password_input=/root/chi-shen-me-auth-email-dual-password.env
            legacy_otp_input=/root/chi-shen-me-auth-email-legacy-otp.env
            fake_bin=/tmp/chi-shen-me-auth-continuity-bin
            docker_sentinel=/tmp/chi-shen-me-auth-continuity-docker-called
            qq_count_sentinel=/tmp/chi-shen-me-auth-continuity-qq-count-called
            qq_identity_state="$test_root/shared/auth-identity-state.env"
            if [[ -e "$test_root" || -L "$test_root" || -e "$lock_directory" || -L "$lock_directory" ||
              -e "$same_input" || -e "$changed_input" || -e "$email_input" ||
                  -e "$qq_input" || -e "$qq_union_input" ||
                  -e "$qq_marker_override_input" ||
                  -e "$qq_missing_key_input" ||
                  -e "$runtime_password_input" || -e "$dual_password_input" ||
                  -e "$legacy_otp_input" ||
                  -e "$fake_bin" || -e "$docker_sentinel" ||
                  -e "$qq_count_sentinel" ]]; then
              echo "auth continuity test path already exists; refusing to alter it" >&2
              exit 1
            fi
            cleanup() {
              rm -f -- "$same_input" "$changed_input" "$email_input" \
                "$qq_input" "$qq_union_input" "$qq_missing_key_input" \
                "$qq_marker_override_input" \
                "$runtime_password_input" "$dual_password_input" \
                "$legacy_otp_input" "$docker_sentinel" "$qq_count_sentinel"
              rm -rf -- "$fake_bin"
              rm -f -- "$lock_directory/auth-secrets.lock" "$lock_directory/mutation.lock"
              rmdir -- "$lock_directory" 2>/dev/null || true
              [[ "$test_root" == /opt/chi-shen-me ]] && rm -rf -- "$test_root"
            }
            trap cleanup EXIT
            active_release="$test_root/releases/ci-auth-active"
            active_deploy="$active_release/deploy"
            candidate="$test_root/releases/ci-auth-continuity/deploy"
            secrets="$test_root/shared/secrets"
            install -d -m 700 "$active_deploy/scripts" "$candidate/scripts" \
              "$test_root/shared" "$secrets" "$fake_bin"
            install -m 700 "$REPOSITORY_ROOT/infra/ecs/scripts/update-auth-secrets.sh" \
              "$candidate/scripts/update-auth-secrets.sh"
            cat >"$candidate/scripts/preflight-deployment.sh" <<"FAKE_PREFLIGHT"
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "${PREFLIGHT_FAIL_FIXTURE:-false}" != "true" ]]
            FAKE_PREFLIGHT
            printf "#!/usr/bin/env bash\nexit 0\n" >"$candidate/scripts/verify-runtime.sh"
            cp -- "$candidate/scripts/verify-runtime.sh" "$active_deploy/scripts/verify-runtime.sh"
            cat >"$fake_bin/docker" <<"FAKE_DOCKER"
          #!/usr/bin/env bash
          set -euo pipefail
          : >"$DOCKER_SENTINEL"
          if [[ "${1:-}" == "compose" && "${4:-}" == "ps" && "${6:-}" == "postgres" ]]; then
            printf "ci-postgres\n"
            exit 0
          fi
          if [[ "${1:-}" == "inspect" ]]; then
            printf "running/healthy\n"
            exit 0
          fi
          if [[ "${1:-}" == "compose" && "${4:-}" == "exec" ]]; then
            cat >/dev/null
            : >"$QQ_COUNT_SENTINEL"
            printf "%s\n" "${QQ_BINDING_COUNT_FIXTURE:-0}"
            exit 0
          fi
          if [[ "${1:-}" == "run" ]]; then
            baseline_env=""
            candidate_env=""
            shift
            while [[ "$#" -gt 0 ]]; do
              if [[ "$1" == "--volume" && "$#" -ge 2 ]]; then
                case "$2" in
                  *:/run/auth-baseline.env:ro) baseline_env="${2%%:*}" ;;
                  *:/run/auth-candidate.env:ro) candidate_env="${2%%:*}" ;;
                esac
                shift 2
              else
                shift
              fi
            done
            if [[ -n "$baseline_env" && -n "$candidate_env" ]]; then
              baseline_dedup="$(sed -n "s/^AUTH_IDENTITY_DEDUP_KEY_VERSION=//p" "$baseline_env")"
              candidate_dedup="$(sed -n "s/^AUTH_IDENTITY_DEDUP_KEY_VERSION=//p" "$candidate_env")"
              [[ "$baseline_dedup" == "$candidate_dedup" ]] || exit 11
            fi
            exit 0
          fi
          exit 0
          FAKE_DOCKER
            chmod 700 "$candidate/scripts/preflight-deployment.sh" \
              "$candidate/scripts/verify-runtime.sh" "$fake_bin/docker"
            cat >"$candidate/deployment.env" <<"EOF"
          API_IMAGE=registry.example.invalid/chi-shen-me/api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AUTH_SCHEMA_TRANSITION_MODE=none
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=true
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          QQ_OPEN_PLATFORM_REALM_ID=eatwhat-qq-primary
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          EOF
            cp -- "$candidate/deployment.env" "$active_deploy/deployment.env"
            ln -s "$active_release" "$test_root/current"
            cat >"$secrets/api.env" <<"EOF"
          DATABASE_URL=postgresql://unused.invalid/unused
          DATABASE_SSL_CA_BASE64=ci-placeholder
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={"hash.v1":"ci-hash-material"}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v1
          AUTH_OTP_PEPPER_ACTIVE_VERSION=otp.v1
          AUTH_OTP_PEPPER_KEYS_JSON={"otp.v1":"ci-otp-material"}
          ALIYUN_PNVS_SIGN_NAME=ci-sign
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          SMTP_HOST=smtp.example.invalid
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_USERNAME=ci-user
          SMTP_PASSWORD=ci-password
          SMTP_FROM_ADDRESS=ci@example.invalid
          SMTP_REPLY_TO=ci@example.invalid
          SMTP_FROM_NAME=ci
          EOF
            cat >"$same_input" <<"EOF"
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=false
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={"hash.v1":"ci-hash-material"}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v1
          ALIYUN_PNVS_SIGN_NAME=ci-sign
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          EOF
            cat >"$changed_input" <<"EOF"
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=false
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={"hash.v1":"ci-hash-material"}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v2
          ALIYUN_PNVS_SIGN_NAME=ci-sign
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          EOF
            cat >"$email_input" <<"EOF"
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=true
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=false
          QQ_UNION_ID_ENABLED=false
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={"hash.v1":"ci-hash-material"}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v1
          ALIYUN_PNVS_SIGN_NAME=ci-sign
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          AUTH_OTP_PEPPER_ACTIVE_VERSION=otp.v1
          AUTH_OTP_PEPPER_KEYS_JSON={"otp.v1":"ci-otp-material"}
          SMTP_HOST=smtp.example.invalid
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_USERNAME=ci-user
          SMTP_APP_PASSWORD=ci-password
          SMTP_FROM_ADDRESS=ci@example.invalid
          SMTP_REPLY_TO=ci@example.invalid
          SMTP_FROM_NAME=ci
          EOF
            qq_app_key_fixture="$(printf "%032d" 0)"
            cat >"$qq_input" <<"EOF"
          ACCOUNTS_ENABLED=true
          PHONE_AUTH_ENABLED=true
          EMAIL_AUTH_ENABLED=false
          WECHAT_AUTH_ENABLED=false
          QQ_AUTH_ENABLED=true
          QQ_UNION_ID_ENABLED=false
          ALIBABA_CLOUD_ECS_METADATA=ci-role
          AUTH_HASH_ACTIVE_VERSION=hash.v1
          AUTH_HASH_KEYS_JSON={"hash.v1":"ci-hash-material"}
          AUTH_IDENTITY_DEDUP_KEY_VERSION=hash.v1
          ALIYUN_PNVS_SIGN_NAME=ci-sign
          ALIYUN_PNVS_TEMPLATE_CODE=100001
          QQ_APP_ID=123456789
          EOF
            printf "QQ_APP_KEY=%s\n" "$qq_app_key_fixture" >>"$qq_input"
            sed "s/^QQ_UNION_ID_ENABLED=false$/QQ_UNION_ID_ENABLED=true/" \
              "$qq_input" >"$qq_union_input"
            cp -- "$same_input" "$qq_marker_override_input"
            printf "QQ_UNION_ID_NAMESPACE_INITIALIZED=true\n" >>"$qq_marker_override_input"
            sed "/^QQ_APP_KEY=/d" "$qq_input" >"$qq_missing_key_input"
            sed "s/^SMTP_APP_PASSWORD=/SMTP_PASSWORD=/" \
              "$email_input" >"$runtime_password_input"
            cp -- "$email_input" "$dual_password_input"
            printf "SMTP_PASSWORD=forbidden-duplicate-runtime-name\n" >>"$dual_password_input"
            sed \
              -e "s/^AUTH_OTP_PEPPER_ACTIVE_VERSION=/EMAIL_OTP_PEPPER_ACTIVE_VERSION=/" \
              -e "s/^AUTH_OTP_PEPPER_KEYS_JSON=/EMAIL_OTP_PEPPER_KEYS_JSON=/" \
              "$email_input" >"$legacy_otp_input"
            chown -R root:root "$test_root" "$same_input" "$changed_input" \
              "$email_input" "$qq_input" "$qq_union_input" \
              "$qq_marker_override_input" \
              "$qq_missing_key_input" \
              "$runtime_password_input" "$dual_password_input" \
              "$legacy_otp_input" "$fake_bin"
            find "$test_root" -type d -exec chmod 700 {} +
            find "$test_root" -type f -exec chmod 600 {} +
            chmod 600 "$same_input" "$changed_input" "$email_input" \
              "$qq_input" "$qq_union_input" "$qq_missing_key_input" \
              "$qq_marker_override_input" \
              "$runtime_password_input" "$dual_password_input" "$legacy_otp_input"
            chmod 700 "$candidate/scripts/update-auth-secrets.sh" \
              "$candidate/scripts/preflight-deployment.sh" \
              "$candidate/scripts/verify-runtime.sh" \
              "$active_deploy/scripts/verify-runtime.sh" "$fake_bin/docker"
            identity_before="$(grep -E "^(AUTH_HASH_ACTIVE_VERSION|AUTH_HASH_KEYS_JSON|AUTH_IDENTITY_DEDUP_KEY_VERSION)=" "$secrets/api.env")"
            otp_before="$(grep -E "^(AUTH_OTP_PEPPER_ACTIVE_VERSION|AUTH_OTP_PEPPER_KEYS_JSON)=" "$secrets/api.env")"
            export DOCKER_SENTINEL="$docker_sentinel"
            export QQ_COUNT_SENTINEL="$qq_count_sentinel"
            export PATH="$fake_bin:$PATH"
            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$same_input" >/dev/null
            [[ "$(grep -E "^(AUTH_HASH_ACTIVE_VERSION|AUTH_HASH_KEYS_JSON|AUTH_IDENTITY_DEDUP_KEY_VERSION)=" "$secrets/api.env")" == "$identity_before" ]]
            [[ "$(grep -E "^(AUTH_OTP_PEPPER_ACTIVE_VERSION|AUTH_OTP_PEPPER_KEYS_JSON)=" "$secrets/api.env")" == "$otp_before" ]]
            ! grep -Eq "^SMTP_" "$secrets/api.env"
            grep -Fxq "ACCOUNTS_ENABLED=true" "$candidate/deployment.env"
            grep -Fxq "PHONE_AUTH_ENABLED=true" "$candidate/deployment.env"
            grep -Fxq "EMAIL_AUTH_ENABLED=false" "$candidate/deployment.env"
            marker_override_api_before="$(sha256sum "$secrets/api.env")"
            marker_override_deployment_before="$(sha256sum "$candidate/deployment.env")"
            rm -f -- "$docker_sentinel"
            set +e
            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$qq_marker_override_input" >/dev/null 2>&1
            marker_override_status=$?
            set -e
            [[ "$marker_override_status" -eq 2 ]]
            [[ "$(sha256sum "$secrets/api.env")" == "$marker_override_api_before" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$marker_override_deployment_before" ]]
            [[ ! -e "$docker_sentinel" ]]
            [[ ! -e "$qq_identity_state" ]]
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"

            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$email_input" >/dev/null
            [[ "$(grep -E "^(AUTH_OTP_PEPPER_ACTIVE_VERSION|AUTH_OTP_PEPPER_KEYS_JSON)=" "$secrets/api.env")" == "$otp_before" ]]
            grep -Fxq "SMTP_PASSWORD=ci-password" "$secrets/api.env"
            ! grep -Eq "^SMTP_APP_PASSWORD=" "$secrets/api.env"
            grep -Fxq "EMAIL_AUTH_ENABLED=true" "$candidate/deployment.env"
            email_api_enabled="$(sha256sum "$secrets/api.env")"
            email_deployment_enabled="$(sha256sum "$candidate/deployment.env")"

            for rejected_input in \
              "$runtime_password_input" "$dual_password_input" "$legacy_otp_input"; do
              rm -f -- "$docker_sentinel"
              set +e
              "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$rejected_input" >/dev/null 2>&1
              rejected_status=$?
              set -e
              [[ "$rejected_status" -eq 2 ]]
              [[ "$(sha256sum "$secrets/api.env")" == "$email_api_enabled" ]]
              [[ "$(sha256sum "$candidate/deployment.env")" == "$email_deployment_enabled" ]]
              [[ ! -e "$docker_sentinel" ]]
              ! compgen -G "$secrets/.api.env.*" >/dev/null
              ! compgen -G "$candidate/.deployment.env.*" >/dev/null
            done

            qq_missing_key_api_before="$(sha256sum "$secrets/api.env")"
            qq_missing_key_deployment_before="$(sha256sum "$candidate/deployment.env")"
            rm -f -- "$docker_sentinel" "$qq_count_sentinel"
            set +e
            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$qq_missing_key_input" >/dev/null 2>&1
            qq_missing_key_status=$?
            set -e
            [[ "$qq_missing_key_status" -eq 2 ]]
            [[ "$(sha256sum "$secrets/api.env")" == "$qq_missing_key_api_before" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$qq_missing_key_deployment_before" ]]
            [[ ! -e "$docker_sentinel" ]]
            [[ ! -e "$qq_count_sentinel" ]]
            [[ ! -e "$qq_identity_state" ]]

            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$same_input" >/dev/null
            grep -Fxq "QQ_AUTH_ENABLED=false" "$candidate/deployment.env"
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"
            [[ ! -e "$qq_identity_state" ]]
            qq_before_identity_state_api="$(sha256sum "$secrets/api.env")"
            qq_before_identity_state_deployment="$(sha256sum "$candidate/deployment.env")"
            export QQ_BINDING_COUNT_FIXTURE=1
            rm -f -- "$docker_sentinel" "$qq_count_sentinel"
            set +e
            qq_nonzero_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$qq_union_input" 2>&1)"
            qq_nonzero_status=$?
            set -e
            [[ "$qq_nonzero_status" -eq 2 ]]
            grep -Fq "QQ_BINDING_COUNT_BEFORE_IDENTITY_STATE_CHANGE=1" <<<"$qq_nonzero_output"
            grep -Fq "QQ identity state initialization or UnionID promotion requires zero existing QQ bindings" <<<"$qq_nonzero_output"
            [[ "$(sha256sum "$secrets/api.env")" == "$qq_before_identity_state_api" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$qq_before_identity_state_deployment" ]]
            [[ ! -e "$qq_identity_state" ]]
            [[ -e "$docker_sentinel" ]]
            [[ -e "$qq_count_sentinel" ]]
            ! compgen -G "$test_root/shared/.auth-identity-state.candidate.*" >/dev/null

            export QQ_BINDING_COUNT_FIXTURE=0
            export PREFLIGHT_FAIL_FIXTURE=true
            rm -f -- "$docker_sentinel" "$qq_count_sentinel"
            set +e
            qq_zero_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$qq_union_input" 2>&1)"
            qq_zero_status=$?
            set -e
            unset PREFLIGHT_FAIL_FIXTURE
            [[ "$qq_zero_status" -eq 3 ]]
            grep -Fq "QQ_BINDING_COUNT_BEFORE_IDENTITY_STATE_CHANGE=0" <<<"$qq_zero_output"
            grep -Fq "updated authentication configuration failed preflight and was rolled back" <<<"$qq_zero_output"
            [[ "$(sha256sum "$secrets/api.env")" == "$qq_before_identity_state_api" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$qq_before_identity_state_deployment" ]]
            [[ "$(stat -c "%a:%u:%g" "$qq_identity_state")" == "600:0:0" ]]
            cmp -s "$qq_identity_state" <(printf "AUTH_IDENTITY_STATE_FORMAT_VERSION=1\nQQ_OPEN_PLATFORM_REALM_ID=eatwhat-qq-primary\nQQ_UNION_ID_NAMESPACE_INITIALIZED=true\n")
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"
            [[ -e "$qq_count_sentinel" ]]
            ! compgen -G "$test_root/shared/.auth-identity-state.candidate.*" >/dev/null
            qq_identity_state_true="$(sha256sum "$qq_identity_state")"

            # This deployment intentionally has no historical marker. Shared true is authoritative.
            export QQ_BINDING_COUNT_FIXTURE=1
            rm -f -- "$docker_sentinel" "$qq_count_sentinel"
            qq_recovery_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$qq_union_input")"
            ! grep -Fq "QQ_BINDING_COUNT_BEFORE_IDENTITY_STATE_CHANGE=" <<<"$qq_recovery_output"
            [[ ! -e "$qq_count_sentinel" ]]
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            grep -Fxq "QQ_APP_ID=123456789" "$secrets/api.env"
            grep -Fxq "QQ_APP_KEY=$qq_app_key_fixture" "$secrets/api.env"
            grep -Fxq "QQ_AUTH_ENABLED=true" "$candidate/deployment.env"
            grep -Fxq "QQ_UNION_ID_ENABLED=true" "$candidate/deployment.env"
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"

            "$candidate/scripts/update-auth-secrets.sh" --disable >/dev/null
            [[ "$(grep -E "^(AUTH_HASH_ACTIVE_VERSION|AUTH_HASH_KEYS_JSON|AUTH_IDENTITY_DEDUP_KEY_VERSION)=" "$secrets/api.env")" == "$identity_before" ]]
            [[ "$(grep -E "^(AUTH_OTP_PEPPER_ACTIVE_VERSION|AUTH_OTP_PEPPER_KEYS_JSON)=" "$secrets/api.env")" == "$otp_before" ]]
            ! grep -Eq "^(ALIYUN_PNVS_|SMTP_|WECHAT_|QQ_APP_(ID|KEY)|ALIYUN_SMS_|ALIYUN_FUSION_)" "$secrets/api.env"
            grep -Fxq "AUTH_SCHEMA_TRANSITION_MODE=none" "$candidate/deployment.env"
            for switch_name in ACCOUNTS_ENABLED PHONE_AUTH_ENABLED EMAIL_AUTH_ENABLED WECHAT_AUTH_ENABLED QQ_AUTH_ENABLED QQ_UNION_ID_ENABLED; do
              grep -Fxq "$switch_name=false" "$candidate/deployment.env"
            done
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"

            export QQ_BINDING_COUNT_FIXTURE=1
            rm -f -- "$qq_count_sentinel"
            qq_reenable_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$qq_union_input")"
            ! grep -Fq "QQ_BINDING_COUNT_BEFORE_IDENTITY_STATE_CHANGE=" <<<"$qq_reenable_output"
            [[ ! -e "$qq_count_sentinel" ]]
            grep -Fxq "QQ_AUTH_ENABLED=true" "$candidate/deployment.env"
            grep -Fxq "QQ_UNION_ID_ENABLED=true" "$candidate/deployment.env"
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"
            qq_union_reenabled_api="$(sha256sum "$secrets/api.env")"
            qq_union_reenabled_deployment="$(sha256sum "$candidate/deployment.env")"
            rm -f -- "$docker_sentinel" "$qq_count_sentinel"
            set +e
            qq_nonunion_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$qq_input" 2>&1)"
            qq_nonunion_status=$?
            set -e
            [[ "$qq_nonunion_status" -eq 2 ]]
            grep -Fq "initialized QQ UnionID namespace requires UnionID whenever QQ authentication is enabled" <<<"$qq_nonunion_output"
            [[ "$(sha256sum "$secrets/api.env")" == "$qq_union_reenabled_api" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$qq_union_reenabled_deployment" ]]
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            [[ ! -e "$docker_sentinel" ]]
            [[ ! -e "$qq_count_sentinel" ]]

            "$candidate/scripts/update-auth-secrets.sh" --disable >/dev/null
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"
            api_disabled="$(sha256sum "$secrets/api.env")"
            deployment_disabled="$(sha256sum "$candidate/deployment.env")"
            identity_state_disabled="$(sha256sum "$qq_identity_state")"
            rm -f -- "$docker_sentinel"
            set +e
            mismatch_output="$($candidate/scripts/update-auth-secrets.sh --apply --config-file "$changed_input" 2>&1)"
            mismatch_status=$?
            set -e
            [[ "$mismatch_status" -eq 2 ]]
            [[ "$mismatch_output" == "reenabling disabled accounts must preserve authentication identity/session continuity: AUTH_IDENTITY_DEDUP_KEY_VERSION" ]]
            [[ "$(sha256sum "$secrets/api.env")" == "$api_disabled" ]]
            [[ "$(sha256sum "$candidate/deployment.env")" == "$deployment_disabled" ]]
            [[ "$(sha256sum "$qq_identity_state")" == "$identity_state_disabled" ]]
            [[ ! -e "$docker_sentinel" ]]
            ! compgen -G "$secrets/.api.env.*" >/dev/null
            ! compgen -G "$candidate/.deployment.env.*" >/dev/null
            "$candidate/scripts/update-auth-secrets.sh" --apply --config-file "$same_input" >/dev/null
            [[ -e "$docker_sentinel" ]]
            [[ "$(grep -E "^(AUTH_HASH_ACTIVE_VERSION|AUTH_HASH_KEYS_JSON|AUTH_IDENTITY_DEDUP_KEY_VERSION)=" "$secrets/api.env")" == "$identity_before" ]]
            [[ "$(grep -E "^(AUTH_OTP_PEPPER_ACTIVE_VERSION|AUTH_OTP_PEPPER_KEYS_JSON)=" "$secrets/api.env")" == "$otp_before" ]]
            grep -Fxq "ACCOUNTS_ENABLED=true" "$candidate/deployment.env"
            grep -Fxq "PHONE_AUTH_ENABLED=true" "$candidate/deployment.env"
            [[ "$(sha256sum "$qq_identity_state")" == "$qq_identity_state_true" ]]
            ! grep -Eq "^QQ_UNION_ID_NAMESPACE_INITIALIZED=" "$candidate/deployment.env"
            grep -Fq "release must preserve the shared QQ Open Platform realm" \
              "$REPOSITORY_ROOT/infra/ecs/scripts/preflight-deployment.sh"
          '
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify UnionID bridge and WeChat realm configuration fixtures
        run: |
          node --input-type=module <<'NODE'
          import { loadAuthRuntimeConfig } from "./apps/api/dist/auth/auth-config.js";
          import { loadDatabaseConfig } from "./apps/api/dist/database/database-config.js";

          const pending = loadDatabaseConfig({
            DATABASE_ENABLED: "false",
            AUTH_SCHEMA_TRANSITION_MODE: "wechat_union_aliases_pending",
            WECHAT_AUTH_ENABLED: "false",
          }, "test");
          if (pending.authSchemaTransitionMode !== "wechat_union_aliases_pending") {
            throw new Error("UnionID bridge mode was not retained");
          }
          let unsafePendingRejected = false;
          try {
            loadDatabaseConfig({
              DATABASE_ENABLED: "false",
              AUTH_SCHEMA_TRANSITION_MODE: "wechat_union_aliases_pending",
              WECHAT_AUTH_ENABLED: "true",
            }, "test");
          } catch (error) {
            unsafePendingRejected = String(error).includes(
              "wechat_union_aliases_pending 时必须关闭 WECHAT_AUTH_ENABLED",
            );
          }
          if (!unsafePendingRejected) {
            throw new Error("UnionID bridge mode accepted enabled WeChat authentication");
          }

          const hashKey = Buffer.alloc(32, 9).toString("base64");
          const validWechat = {
            PHONE_AUTH_ENABLED: "true",
            EMAIL_AUTH_ENABLED: "false",
            WECHAT_AUTH_ENABLED: "true",
            QQ_AUTH_ENABLED: "false",
            QQ_UNION_ID_ENABLED: "false",
            AUTH_HASH_ACTIVE_VERSION: "hash.v1",
            AUTH_HASH_KEYS_JSON: JSON.stringify({ "hash.v1": hashKey }),
            AUTH_IDENTITY_DEDUP_KEY_VERSION: "hash.v1",
            ALIYUN_CREDENTIAL_ALLOWED_PROVIDER: "default/ecs_ram_role",
            ALIYUN_PNVS_SIGN_NAME: "吃什么",
            ALIYUN_PNVS_TEMPLATE_CODE: "100001",
            WECHAT_APP_ID: "wx0123456789abcdef",
            WECHAT_APP_SECRET: "ci-placeholder-not-a-real-secret",
            WECHAT_OPEN_PLATFORM_REALM_ID: "eatwhat-primary",
          };
          const options = {
            accountsEnabled: true,
            databaseEnabled: true,
            production: true,
          };
          const configured = loadAuthRuntimeConfig(validWechat, options);
          if (
            !configured.wechat.enabled ||
            configured.wechat.openPlatformRealmId !== "eatwhat-primary"
          ) {
            throw new Error("enabled WeChat configuration lost its Open Platform realm");
          }
          for (const invalid of [
            Object.fromEntries(
              Object.entries(validWechat).filter(
                ([name]) => name !== "WECHAT_OPEN_PLATFORM_REALM_ID",
              ),
            ),
            { ...validWechat, WECHAT_OPEN_PLATFORM_REALM_ID: "EatWhat-Primary" },
          ]) {
            let rejected = false;
            try {
              loadAuthRuntimeConfig(invalid, options);
            } catch {
              rejected = true;
            }
            if (!rejected) throw new Error("invalid WeChat realm configuration was accepted");
          }
          NODE

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: chi_shen_me_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chi_shen_me_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and PostgreSQL client
        run: |
          pnpm install --frozen-lockfile
          # pg_dump must match the PostgreSQL 17 service, not Ubuntu's default 16.
          # The runner image removes its build-time PGDG source. Reject an
          # unexpected retained source instead of risking conflicting Signed-By.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [[ -f "$source" ]] || continue
            if grep -Fq 'apt.postgresql.org' "$source"; then
              printf 'Unexpected existing PGDG source: %s\n' "$source" >&2
              exit 1
            fi
          done
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' \
            'Architectures: amd64' \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          printf '%s\n' /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          for tool in psql pg_dump pg_restore; do
            version="$(/usr/lib/postgresql/17/bin/"$tool" --version)"
            printf '%s\n' "$version"
            [[ "$version" =~ PostgreSQL\)\ 17[.] ]]
          done
      - name: Bootstrap extensions and isolated least-privilege roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
          PGUSER: postgres
          PGPASSWORD: ci-bootstrap-password
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE schema_migrator LOGIN PASSWORD 'ci-migrator-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE api_runtime LOGIN PASSWORD 'ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE retention_worker LOGIN PASSWORD 'ci-maintenance-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE admin_api_runtime LOGIN PASSWORD 'ci-admin-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE data_export_worker LOGIN PASSWORD 'ci-export-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER SCHEMA public OWNER TO schema_migrator;
          GRANT CONNECT ON DATABASE chi_shen_me_ci
            TO schema_migrator, api_runtime, retention_worker, admin_api_runtime,
               data_export_worker;
          SQL
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -f infra/postgres/bootstrap-extensions.sql
      - name: Migrate an empty database and prove idempotency
        env:
          NODE_ENV: test
