            IF (SELECT count(*) FROM public.admin_list_active_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1'
            )) <> 4 OR (
              SELECT array_agg(active.config_key ORDER BY active.config_key)
              FROM public.admin_list_active_app_config(
                repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
                repeat('11223344',8), 'ci-config-bind-v1'
              ) AS active
            ) IS DISTINCT FROM ARRAY[
              'coverage.default', 'features.ai-assistance',
              'recommendations.prompt', 'recommendations.rules'
