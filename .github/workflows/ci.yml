          DATABASE_MIGRATION_SSL_MODE: disable
        run: |
          pnpm --filter @chi-shen-me/api build
          node apps/api/dist/database/migrate-cli.js
          node apps/api/dist/database/migrate-cli.js
      - name: Apply role grants atomically and test deployment failure gates
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
        run: |
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          if psql -X -f infra/postgres/role-grants.sql >/tmp/missing-role.log 2>&1; then
            echo "role grant script accepted missing variables" >&2
            exit 1
          fi
          if psql -X -v migration_owner=schema_migrator \
            -v runtime_role=missing_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql >/tmp/invalid-role.log 2>&1; then
            echo "role grant script accepted an unknown role" >&2
            exit 1
          fi
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          psql -X -v ON_ERROR_STOP=1 -c \
            "GRANT UPDATE (destination_hash) ON public.otp_challenges TO api_runtime; GRANT SELECT ON public.users TO PUBLIC; GRANT UPDATE (destination_hash) ON public.otp_challenges TO PUBLIC"
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f infra/postgres/role-grants.sql
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          test "$(psql -X -At -c "SELECT has_column_privilege('api_runtime','public.otp_challenges','destination_hash','UPDATE')")" = "f"
          test "$(psql -X -At -c "SELECT has_table_privilege('retention_worker','public.users','SELECT')")" = "f"
          test "$(psql -X -At -c "SELECT has_column_privilege('retention_worker','public.otp_challenges','destination_hash','UPDATE')")" = "f"
          test "$(psql -X -At -c "SELECT has_table_privilege('api_runtime','public.users','SELECT')")" = "t"
          test "$(psql -X -At -c "SELECT count(*) || '|' || max(version) || '|' || max(name) FILTER (WHERE version=13) FROM public.schema_migrations")" = "13|13|admin_config_control"
          for role in api_runtime retention_worker admin_api_runtime data_export_worker; do
            test "$(psql -X -At -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER']) AS checked(privilege_name) WHERE has_table_privilege('$role','public.wechat_union_aliases',privilege_name)")" = "0"
            test "$(psql -X -At -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','REFERENCES']) AS checked(privilege_name) WHERE has_any_column_privilege('$role','public.wechat_union_aliases',privilege_name)")" = "0"
          done
          test "$(psql -X -At -c "SELECT count(*) FROM pg_class AS relation CROSS JOIN LATERAL aclexplode(COALESCE(relation.relacl,acldefault('r',relation.relowner))) AS acl WHERE relation.oid='public.wechat_union_aliases'::regclass AND acl.grantee=0")" = "0"
          for function_name in \
            'public.consume_oauth_state_with_wechat_union(uuid,character varying,character varying,character varying,character varying,uuid,character varying,character varying,character varying,character varying,character varying,character varying,character varying,character varying)' \
            'public.record_wechat_union_alias_from_consumed_state(uuid,uuid)' \
            'public.bind_oauth_identity_with_wechat_union_from_consumed_state(uuid,uuid,character varying,character varying,character varying,character varying)'; do
            test "$(psql -X -At -c "SELECT has_function_privilege('api_runtime','$function_name','EXECUTE')")" = "t"
            for forbidden_role in retention_worker admin_api_runtime data_export_worker; do
              test "$(psql -X -At -c "SELECT has_function_privilege('$forbidden_role','$function_name','EXECUTE')")" = "f"
            done
            test "$(psql -X -At -c "SELECT count(*) FROM pg_proc AS procedure CROSS JOIN LATERAL aclexplode(COALESCE(procedure.proacl,acldefault('f',procedure.proowner))) AS acl WHERE procedure.oid='$function_name'::regprocedure AND acl.grantee=0 AND acl.privilege_type='EXECUTE'")" = "0"
          done
          for function_name in \
            'public.preview_fusion_auth_retention_cleanup()' \
            'public.execute_fusion_auth_retention_cleanup()'; do
            test "$(psql -X -At -c "SELECT has_function_privilege('retention_worker','$function_name','EXECUTE')")" = "t"
            for forbidden_role in api_runtime admin_api_runtime data_export_worker; do
              test "$(psql -X -At -c "SELECT has_function_privilege('$forbidden_role','$function_name','EXECUTE')")" = "f"
            done
          done
          export PGUSER=retention_worker PGPASSWORD=ci-maintenance-password
          test "$(psql -X -At -c "SELECT policy_code || '|' || affected_count FROM public.preview_fusion_auth_retention_cleanup()")" = "FUSION_AUTH_24H|0"
          test "$(psql -X -At -c "SELECT policy_code || '|' || affected_count FROM public.execute_fusion_auth_retention_cleanup()")" = "FUSION_AUTH_24H|0"
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          sed 's/public.coverage_areas/public.deliberately_missing_relation/' \
            infra/postgres/role-grants.sql >/tmp/failing-role-grants.sql
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          if psql -X -v migration_owner=schema_migrator \
            -v runtime_role=api_runtime -v maintenance_role=retention_worker \
            -v admin_runtime_role=admin_api_runtime -v export_worker_role=data_export_worker \
            -f /tmp/failing-role-grants.sql >/tmp/mid-grant.log 2>&1; then
            echo "deliberately broken role grant script unexpectedly succeeded" >&2
            exit 1
          fi
          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          test "$(psql -X -At -c "SELECT has_table_privilege('api_runtime','public.users','SELECT')")" = "t"
      - name: Exercise support feedback HTTP and PostgreSQL vertical flow
