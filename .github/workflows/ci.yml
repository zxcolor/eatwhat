  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # GitHub isolates branch caches. Repository pushes can warm their own
          # cache; pull requests only read and cannot publish cache entries.
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager is missing or not executable at $sdkmanager"
            exit 1
          fi
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Test Android build-logic security policies
        # Re-execute tests while allowing their compilation dependencies to be cached.
        run: ./gradlew -p buildSrc test --rerun --build-cache --profile --console=plain --stacktrace
      - name: Reject Fusion SDK, phone-state permission, and legacy auth UI
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.kt' --include='*.java' --include='*.xml' --include='*.kts' \
            'com\.alicom\.fusion|AlicomFusion|FusionAuth|fusionauth-[^[:space:]]*\.aar|umeng-(common|asms)[^[:space:]]*\.aar|android\.permission\.READ_PHONE_STATE|一键登录|图形验证' \
            app/src app/build.gradle.kts; then
            echo "Fusion SDK, READ_PHONE_STATE, or legacy authentication UI remains in Android source" >&2
            exit 1
          fi
      - name: Verify cloud Debug
        run: >-
          ./gradlew testDebugUnitTest --rerun lintDebug assembleDebug
          --build-cache --profile --console=plain --stacktrace
      - name: Verify executed JVM test reports
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          groups = {
              "build-logic": Path("buildSrc/build/test-results/test"),
              "android-debug": Path("app/build/test-results/testDebugUnitTest"),
          }
          results = {}
          for name, directory in groups.items():
              reports = sorted(directory.glob("TEST-*.xml"))
              if not reports:
                  raise SystemExit(f"{name}: no JUnit reports were generated")
              totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
              for report in reports:
                  suite = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
              if totals["tests"] <= 0 or any(totals[key] for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"{name}: incomplete or unsuccessful JVM tests: {totals}")
              results[name] = totals
          output = Path("build/reports/ci/jvm-tests.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(results, indent=2) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n### JVM tests executed on this runner\n\n")
              for name, totals in results.items():
                  summary.write(f"- {name}: {totals['tests']} passed; 0 failed, errored or skipped.\n")
          PY
      - name: Verify Release manifest
        run: >-
          ./gradlew processReleaseMainManifest
          -PCHISHENME_API_BASE_URL=https://api.eatwhat.pro/
          --stacktrace
      - name: Assemble isolated Fixture test artifacts
        run: >-
          ./gradlew assembleFixture assembleFixtureAndroidTest
          --build-cache --profile --console=plain --stacktrace
      - name: Reject Fusion contents in generated APKs
        shell: bash
        run: |
          set -euo pipefail
          build_tools="${ANDROID_SDK_ROOT:?}/build-tools/36.0.0"
          for apk in app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/fixture/app-fixture.apk \
            app/build/outputs/apk/androidTest/fixture/app-fixture-androidTest.apk; do
            manifest="$($build_tools/aapt2 dump xmltree --file AndroidManifest.xml "$apk")"
            if grep -Eqi 'android\.permission\.READ_PHONE_STATE|com\.alicom\.fusion|AlicomFusion|FusionAuth' <<<"$manifest"; then
              echo "$apk contains a Fusion component or READ_PHONE_STATE" >&2
              exit 1
            fi
            if unzip -Z1 "$apk" | grep -Eqi 'fusionauth|umeng-(common|asms)'; then
              echo "$apk packages a removed Fusion artifact" >&2
              exit 1
            fi
            while IFS= read -r dex_entry; do
              dex_file="$(mktemp)"
              unzip -p "$apk" "$dex_entry" >"$dex_file"
              if "$build_tools/dexdump" -d "$dex_file" | grep -Eqi 'com[\./]alicom[\./]fusion|AlicomFusion|FusionAuth|一键登录|图形验证'; then
                rm -f "$dex_file"
                echo "$apk DEX contains removed Fusion code or legacy UI text" >&2
                exit 1
              fi
              rm -f "$dex_file"
            done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$')
          done
      - name: Verify unsigned Alpha fails closed
        shell: bash
        run: |
          test ! -e app/build/outputs/apk/alpha/app-alpha.apk
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          set +e
          ./gradlew assembleAlpha \
            -PCHISHENME_ALPHA_API_BASE_URL=https://api.eatwhat.pro/ \
            --no-daemon --no-build-cache --no-configuration-cache >"$log_file" 2>&1
          status=$?
          set -e
          cat "$log_file"
          if [[ $status -eq 0 ]]; then
            echo "Alpha assembly unexpectedly accepted missing fixed signing material" >&2
            exit 1
          fi
          grep -Fq '[ALPHA_SIGNING_MISSING]' "$log_file"
          test ! -e app/build/outputs/apk/alpha/app-alpha.apk
      - name: Verify unsigned release fails closed
        shell: bash
        run: |
          set -euo pipefail
          assert_unsigned_release_rejected() {
            local label="$1"
            shift
            local log_file
            log_file="$(mktemp)"
            set +e
            ./gradlew "$@" \
              -PCHISHENME_API_BASE_URL=https://api.eatwhat.pro/ \
              --no-daemon --no-build-cache --no-configuration-cache >"$log_file" 2>&1
            local status=$?
            set -e
            cat "$log_file"
            if [[ $status -eq 0 ]]; then
              rm -f "$log_file"
              echo "$label unexpectedly accepted missing signing material" >&2
              exit 1
            fi
            if ! grep -Fq '[RELEASE_SIGNING_MISSING]' "$log_file"; then
              rm -f "$log_file"
              echo "$label failed for a reason other than missing Release signing" >&2
              exit 1
            fi
            rm -f "$log_file"
          }
          assert_unsigned_release_rejected assemble assembleRelease
          assert_unsigned_release_rejected bundle bundleRelease
          assert_unsigned_release_rejected mixed processReleaseMainManifest assembleRelease
          test ! -e app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/bundle/release/app-release.aab
      - name: Preserve Android build performance reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/build/reports/profile/**
            apps/android/buildSrc/build/reports/profile/**
            apps/android/build/reports/ci/jvm-tests.json
          if-no-files-found: warn
          retention-days: 7
