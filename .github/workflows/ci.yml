              RAISE EXCEPTION 'administrator active configuration list is incomplete';
            END IF;

            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'features.ai-assistance', 1, '{"enabled":false}'::jsonb,
