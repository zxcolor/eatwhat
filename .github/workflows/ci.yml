      - name: Exercise administrator configuration publish, rollback and ACL gates
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: chi_shen_me_ci
        run: |
          set -euo pipefail
          export PGUSER=schema_migrator PGPASSWORD=ci-migrator-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SELECT set_config('chi_shen_me.admin_security_mutation','enabled',true);
          INSERT INTO public.admin_users (
            id, login_lookup_hash, login_hash_algorithm, login_hash_key_version,
            status, created_at, status_changed_at
          ) VALUES
            (
              'a3000000-0000-0000-0000-000000000001', repeat('abcdef01',8),
              'HMAC-SHA256', 'ci-v1', 'ACTIVE', now(), now()
            ),
            (
              'a4000000-0000-0000-0000-000000000001', repeat('10fedcba',8),
              'HMAC-SHA256', 'ci-v1', 'ACTIVE', now(), now()
            );
          INSERT INTO public.admin_user_roles (admin_user_id, role_id)
          SELECT fixture.admin_user_id, role.id
          FROM (VALUES
            ('a3000000-0000-0000-0000-000000000001'::uuid, 'ALGORITHM_ADMIN'::text),
            ('a3000000-0000-0000-0000-000000000001'::uuid, 'AUDITOR'::text),
            ('a4000000-0000-0000-0000-000000000001'::uuid, 'OPERATOR'::text)
          ) AS fixture(admin_user_id, role_code)
          JOIN public.admin_roles AS role ON role.role_code = fixture.role_code;
          INSERT INTO public.admin_sessions (
            id, admin_user_id, token_hash, token_hash_algorithm,
            token_hash_key_version, device_hash, last_ip_hash,
            binding_hash_key_version, created_at, last_seen_at,
            idle_expires_at, absolute_expires_at, retain_until
          ) VALUES
            (
              'e3000000-0000-0000-0000-000000000001',
              'a3000000-0000-0000-0000-000000000001', repeat('13579bdf',8),
              'HMAC-SHA256', 'ci-v1', repeat('11223344',8), repeat('55667788',8),
              'ci-config-bind-v1', now(), now(), now() + interval '15 minutes',
              now() + interval '8 hours', now() + interval '30 days 8 hours'
            ),
            (
              'e4000000-0000-0000-0000-000000000001',
              'a4000000-0000-0000-0000-000000000001', repeat('2468ace0',8),
              'HMAC-SHA256', 'ci-v1', repeat('99aabbcc',8), repeat('ddeeff00',8),
              'ci-config-bind-v1', now(), now(), now() + interval '15 minutes',
              now() + interval '8 hours', now() + interval '30 days 8 hours'
            );
          SELECT set_config('chi_shen_me.admin_security_mutation','disabled',true);
          COMMIT;
          SQL

          export PGUSER=postgres PGPASSWORD=ci-bootstrap-password
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_proc AS routine WHERE routine.pronamespace='public'::regnamespace AND routine.proname IN ('runtime_list_active_app_config','admin_list_sanitized_audit_events_v2','admin_list_active_app_config','admin_list_app_config_history','admin_publish_app_config','admin_rollback_app_config') AND has_function_privilege('api_runtime',routine.oid,'EXECUTE')")" = "1"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_proc AS routine WHERE routine.pronamespace='public'::regnamespace AND routine.proname IN ('runtime_list_active_app_config','admin_list_sanitized_audit_events_v2','admin_list_active_app_config','admin_list_app_config_history','admin_publish_app_config','admin_rollback_app_config') AND has_function_privilege('admin_api_runtime',routine.oid,'EXECUTE')")" = "5"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_proc AS routine WHERE routine.pronamespace='public'::regnamespace AND routine.proname IN ('runtime_list_active_app_config','admin_list_sanitized_audit_events_v2','admin_list_active_app_config','admin_list_app_config_history','admin_publish_app_config','admin_rollback_app_config') AND (has_function_privilege('retention_worker',routine.oid,'EXECUTE') OR has_function_privilege('data_export_worker',routine.oid,'EXECUTE'))")" = "0"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_proc AS routine CROSS JOIN LATERAL aclexplode(COALESCE(routine.proacl,acldefault('f',routine.proowner))) AS acl WHERE routine.pronamespace='public'::regnamespace AND routine.proname IN ('app_config_value_is_valid','reject_direct_app_config_mutation','runtime_list_active_app_config','admin_list_sanitized_audit_events_v2','admin_list_active_app_config','admin_list_app_config_history','admin_publish_app_config','admin_rollback_app_config') AND acl.grantee=0 AND acl.privilege_type='EXECUTE'")" = "0"
          for role in api_runtime retention_worker admin_api_runtime data_export_worker; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER']) AS checked(privilege_name) WHERE has_table_privilege('$role','public.app_config_versions',privilege_name)")" = "0"
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM unnest(ARRAY['SELECT','INSERT','UPDATE','REFERENCES']) AS checked(privilege_name) WHERE has_any_column_privilege('$role','public.app_config_versions',privilege_name)")" = "0"
          done

          export PGUSER=admin_api_runtime PGPASSWORD=ci-admin-runtime-password
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $ci_config$
          DECLARE
            outcome record;
            history_versions integer[];
          BEGIN
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'features.ai-assistance', NULL::integer,
              '{"enabled":true}'::jsonb, 'ROUTINE_TUNING'
            );
            IF outcome.status IS DISTINCT FROM 'PUBLISHED'
              OR outcome.version IS DISTINCT FROM 1
              OR outcome.config_schema IS DISTINCT FROM 'FEATURE_FLAGS_V1'
              OR outcome.classification IS DISTINCT FROM 'PUBLIC' THEN
              RAISE EXCEPTION 'feature configuration initial publish failed';
            END IF;
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'recommendations.rules', NULL::integer,
              '{"qualityWeight":25,"timeWeight":20,"budgetWeight":20,"intentWeight":15,"diversityWeight":15,"operationsAdjustmentMaximum":5}'::jsonb,
              'ROUTINE_TUNING'
            );
            IF outcome.status IS DISTINCT FROM 'PUBLISHED'
              OR outcome.version IS DISTINCT FROM 1
              OR outcome.config_schema IS DISTINCT FROM 'RECOMMENDATION_RULES_V1'
              OR outcome.classification IS DISTINCT FROM 'INTERNAL' THEN
              RAISE EXCEPTION 'recommendation rules initial publish failed';
            END IF;
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'recommendations.prompt', NULL::integer,
              '{"enabled":true,"promptVersion":"intent-prompt-v1","modelVersion":"qwen3.7-flash-2026-07-15","timeoutMs":1500}'::jsonb,
              'ROUTINE_TUNING'
            );
            IF outcome.status IS DISTINCT FROM 'PUBLISHED'
              OR outcome.version IS DISTINCT FROM 1
              OR outcome.config_schema IS DISTINCT FROM 'PROMPT_SETTINGS_V1'
              OR outcome.classification IS DISTINCT FROM 'INTERNAL' THEN
              RAISE EXCEPTION 'prompt settings initial publish failed';
            END IF;
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'coverage.default', NULL::integer,
              '{"defaultRadiusMeters":1500,"maximumRadiusMeters":2500,"areaCode":"NATIONWIDE"}'::jsonb,
              'RELEASE_COMPATIBILITY'
            );
            IF outcome.status IS DISTINCT FROM 'PUBLISHED'
              OR outcome.version IS DISTINCT FROM 1
              OR outcome.config_schema IS DISTINCT FROM 'COVERAGE_SETTINGS_V1'
              OR outcome.classification IS DISTINCT FROM 'PUBLIC' THEN
              RAISE EXCEPTION 'coverage settings initial publish failed';
            END IF;
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'clients.minimum-version', NULL::integer,
              '{"android":"1.2.3","ios":"1.2.0","miniprogram":"1.1.0"}'::jsonb,
              'RELEASE_COMPATIBILITY'
            );
            IF outcome.status IS DISTINCT FROM 'CLIENT_RELEASE_UNVERIFIED'
              OR outcome.version IS NOT NULL OR outcome.value_json IS NOT NULL THEN
              RAISE EXCEPTION 'unverified minimum client version initial publish was accepted';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.admin_list_app_config_history(
                repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
                repeat('11223344',8), 'ci-config-bind-v1',
                'clients.minimum-version', 20
              )
            ) OR EXISTS (
              SELECT 1 FROM public.admin_list_sanitized_audit_events_v2(
                repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
                repeat('11223344',8), 'ci-config-bind-v1',
                NULL::timestamptz, NULL::uuid, 101
              ) AS audit
              WHERE audit.config_key = 'clients.minimum-version'
            ) THEN
              RAISE EXCEPTION 'rejected minimum client version publish wrote configuration or audit';
            END IF;

            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'recommendations.prompt', 1,
              '{"enabled":true,"promptVersion":"unregistered-prompt","modelVersion":"qwen3.7-flash-2026-07-15","timeoutMs":1500}'::jsonb,
              'ROUTINE_TUNING'
            );
