              RAISE EXCEPTION 'unregistered prompt label was accepted';
            END IF;
            SELECT * INTO outcome FROM public.admin_publish_app_config(
              repeat('13579bdf',8), 'ci-v1', repeat('55667788',8),
              repeat('11223344',8), 'ci-config-bind-v1',
              'recommendations.prompt', 1,
              '{"enabled":true,"promptVersion":"intent-prompt-v1","modelVersion":"unregistered-model","timeoutMs":1500}'::jsonb,
              'ROUTINE_TUNING'
            );
