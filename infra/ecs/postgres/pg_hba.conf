# PostgreSQL 17 / PostGIS 3.5 single-host Alpha policy.
# All TCP clients must use TLS and SCRAM. The Compose database network is
# internal-only; its fixed subnet is additionally enforced here.

# Controlled in-container provisioning still authenticates over the Unix
# socket. POSTGRES_PASSWORD_FILE supplies the bootstrap password.
local   all             all                                     scram-sha-256
local   replication     all                                     reject

# Refuse every plaintext TCP connection before considering TLS rules.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostnossl replication   all             0.0.0.0/0               reject
hostnossl replication   all             ::/0                    reject

# API and controlled one-shot ops containers live only on this private bridge.
# A subnet rule also permits `docker compose run` one-off containers, whose
# address is allocated dynamically inside the same internal network.
hostssl all             all             172.30.20.0/28           scram-sha-256

# Replication is not part of the single-ECS Alpha topology.
hostssl replication     all             0.0.0.0/0               reject
hostssl replication     all             ::/0                    reject

# Fail closed if this file is reused with any additional network.
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject
