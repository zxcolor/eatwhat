# Staged-only BaoTa vhost for the API subdomain.
# Do not install this file until DNS, the dedicated certificate and the
# api.unfinished-era.com well-known include have been provisioned and checked.
server
{
    listen 80;
    server_name api.unfinished-era.com;

    include /www/server/panel/vhost/nginx/well-known/api.unfinished-era.com.conf;

    location / {
        return 301 https://api.unfinished-era.com$request_uri;
    }
}

server
{
    listen 443 ssl;
    http2 on;
    server_name api.unfinished-era.com;

    ssl_certificate /www/server/panel/vhost/cert/api.unfinished-era.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.unfinished-era.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:API_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    include /www/server/panel/vhost/nginx/well-known/api.unfinished-era.com.conf;

    client_max_body_size 128k;
    client_body_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;

    location = /health {
        proxy_pass http://127.0.0.1:__API_LOOPBACK_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:__API_LOOPBACK_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
    }

    location = /v1 {
        proxy_pass http://127.0.0.1:__API_LOOPBACK_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:__API_LOOPBACK_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
    }

    location / {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND"}';
    }

    access_log off;
    error_log /www/wwwlogs/api.unfinished-era.com.error.log warn;
}
