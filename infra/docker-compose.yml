services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: chi_shen_me
      POSTGRES_USER: chi_shen_me
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chi_shen_me -d chi_shen_me"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api-migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/database/migrate-cli.js"]
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://chi_shen_me:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/chi_shen_me
      DATABASE_MIGRATION_URL: postgresql://chi_shen_me:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/chi_shen_me
      DATABASE_SSL_MODE: disable
      DATABASE_MIGRATION_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      # 普通 API 进程显式关闭管理员能力，也不注入任何 ADMIN_* Secret。
      ADMIN_API_ENABLED: "false"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgresql://chi_shen_me:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/chi_shen_me
      DATABASE_SSL_MODE: disable
      DATABASE_EXPECTED_TARGET: ${DATABASE_EXPECTED_TARGET:-}
      DATABASE_RUNTIME_ROLE_NAME: ${DATABASE_RUNTIME_ROLE_NAME:-}
      DATABASE_MIGRATION_ROLE_NAME: ${DATABASE_MIGRATION_ROLE_NAME:-}
      DATABASE_MAINTENANCE_ROLE_NAME: ${DATABASE_MAINTENANCE_ROLE_NAME:-}
      DATABASE_EXPORT_WORKER_ROLE_NAME: ${DATABASE_EXPORT_WORKER_ROLE_NAME:-}
      DATA_RIGHTS_MODE: ${DATA_RIGHTS_MODE:-LIVE_DISPLAY_ONLY}
      DATA_RIGHTS_AUTHORIZATION_ID: ${DATA_RIGHTS_AUTHORIZATION_ID:-}
      DATA_RIGHTS_AUTHORIZATION_EXPIRES_AT: ${DATA_RIGHTS_AUTHORIZATION_EXPIRES_AT:-}
      ALLOW_DEMO_DATA: ${ALLOW_DEMO_DATA:-true}
      # 单连字符只在变量未定义时提供默认值；显式空串必须原样传入并触发 API 门禁。
      RECOMMENDATION_PROVIDER_PRIORITY: ${RECOMMENDATION_PROVIDER_PRIORITY-AMAP,DEMO}
      LOCATION_SEARCH_PROVIDER_PRIORITY: ${LOCATION_SEARCH_PROVIDER_PRIORITY-AMAP,DEMO}
      PLACE_SEARCH_PROVIDER_PRIORITY: ${PLACE_SEARCH_PROVIDER_PRIORITY-AMAP,DEMO}
      AMAP_ENABLED: ${AMAP_ENABLED:-false}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_WEB_SERVICE_SIGNATURE_PRIVATE_KEY: ${AMAP_WEB_SERVICE_SIGNATURE_PRIVATE_KEY:-}
      AMAP_IP_WHITELIST_CONFIGURED: ${AMAP_IP_WHITELIST_CONFIGURED:-false}
      AMAP_TIMEOUT_MS: ${AMAP_TIMEOUT_MS:-2200}
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-flash-2026-07-15}
      QWEN_TIMEOUT_MS: ${QWEN_TIMEOUT_MS:-2500}
      RULE_VERSION: ${RULE_VERSION:-recommendation-rules-v1}
      PROMPT_VERSION: ${PROMPT_VERSION:-intent-prompt-v1}
      MINIMUM_SUPPORTED_VERSION: ${MINIMUM_SUPPORTED_VERSION:-0.1.0}
      ACCOUNTS_ENABLED: ${ACCOUNTS_ENABLED:-false}
      FAVORITES_ENABLED: ${FAVORITES_ENABLED:-false}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-false}
      PRIVATE_FEEDBACK_ENABLED: ${PRIVATE_FEEDBACK_ENABLED:-false}
      DATA_EXPORT_ENABLED: ${DATA_EXPORT_ENABLED:-false}
      DATA_EXPORT_WORKER_READY: ${DATA_EXPORT_WORKER_READY:-false}
      DATA_EXPORT_OSS_REGION: ${DATA_EXPORT_OSS_REGION:-oss-cn-beijing}
      DATA_EXPORT_OSS_BUCKET: ${DATA_EXPORT_OSS_BUCKET:-}
      DATA_EXPORT_OSS_INTERNAL: ${DATA_EXPORT_OSS_INTERNAL:-true}
      DATA_EXPORT_OSS_TIMEOUT_MS: ${DATA_EXPORT_OSS_TIMEOUT_MS:-10000}
      DATA_EXPORT_CREDENTIAL_TIMEOUT_MS: ${DATA_EXPORT_CREDENTIAL_TIMEOUT_MS:-3000}
      DATA_EXPORT_MAX_ARTIFACT_BYTES: ${DATA_EXPORT_MAX_ARTIFACT_BYTES:-10485760}
      DATA_EXPORT_DOWNLOAD_TOTAL_TIMEOUT_MS: ${DATA_EXPORT_DOWNLOAD_TOTAL_TIMEOUT_MS:-120000}
      DATA_EXPORT_DOWNLOAD_IDLE_TIMEOUT_MS: ${DATA_EXPORT_DOWNLOAD_IDLE_TIMEOUT_MS:-15000}
      DATA_EXPORT_LOCATOR_ACTIVE_VERSION: ${DATA_EXPORT_LOCATOR_ACTIVE_VERSION:-}
      DATA_EXPORT_LOCATOR_KEYS_JSON: ${DATA_EXPORT_LOCATOR_KEYS_JSON:-}
      SUPPORT_FEEDBACK_ENABLED: ${SUPPORT_FEEDBACK_ENABLED:-false}
      SUPPORT_FEEDBACK_ENCRYPTION_ACTIVE_VERSION: ${SUPPORT_FEEDBACK_ENCRYPTION_ACTIVE_VERSION:-}
      SUPPORT_FEEDBACK_ENCRYPTION_KEYS_JSON: ${SUPPORT_FEEDBACK_ENCRYPTION_KEYS_JSON:-}
      SUPPORT_FEEDBACK_HMAC_ACTIVE_VERSION: ${SUPPORT_FEEDBACK_HMAC_ACTIVE_VERSION:-}
      SUPPORT_FEEDBACK_HMAC_KEYS_JSON: ${SUPPORT_FEEDBACK_HMAC_KEYS_JSON:-}
      AUTH_SCHEMA_TRANSITION_MODE: ${AUTH_SCHEMA_TRANSITION_MODE:-none}
      PHONE_AUTH_ENABLED: ${PHONE_AUTH_ENABLED:-false}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      WECHAT_AUTH_ENABLED: ${WECHAT_AUTH_ENABLED:-false}
      QQ_AUTH_ENABLED: ${QQ_AUTH_ENABLED:-false}
      QQ_UNION_ID_ENABLED: ${QQ_UNION_ID_ENABLED:-false}
      AUTH_HASH_ACTIVE_VERSION: ${AUTH_HASH_ACTIVE_VERSION:-}
      AUTH_HASH_KEYS_JSON: ${AUTH_HASH_KEYS_JSON:-}
      AUTH_OTP_PEPPER_ACTIVE_VERSION: ${AUTH_OTP_PEPPER_ACTIVE_VERSION:-}
      AUTH_OTP_PEPPER_KEYS_JSON: ${AUTH_OTP_PEPPER_KEYS_JSON:-}
      AUTH_IDENTITY_DEDUP_KEY_VERSION: ${AUTH_IDENTITY_DEDUP_KEY_VERSION:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_OTP_TTL_SECONDS: ${AUTH_OTP_TTL_SECONDS:-300}
      AUTH_OTP_RESEND_SECONDS: ${AUTH_OTP_RESEND_SECONDS:-60}
      AUTH_OAUTH_STATE_TTL_SECONDS: ${AUTH_OAUTH_STATE_TTL_SECONDS:-600}
      ALIBABA_CLOUD_ECS_METADATA: ${ALIBABA_CLOUD_ECS_METADATA:-}
      ALIBABA_CLOUD_IMDSV1_DISABLED: ${ALIBABA_CLOUD_IMDSV1_DISABLED:-true}
      ALIBABA_CLOUD_ECS_IMDSV2_ENABLE: ${ALIBABA_CLOUD_ECS_IMDSV2_ENABLE:-true}
      ALIBABA_CLOUD_ECS_METADATA_DISABLED: ${ALIBABA_CLOUD_ECS_METADATA_DISABLED:-false}
      ALIYUN_CREDENTIAL_TIMEOUT_MS: ${ALIYUN_CREDENTIAL_TIMEOUT_MS:-2000}
      ALIYUN_CREDENTIAL_ALLOWED_PROVIDER: ${ALIYUN_CREDENTIAL_ALLOWED_PROVIDER:-default/ecs_ram_role}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:-}
      ALIYUN_PNVS_TIMEOUT_MS: ${ALIYUN_PNVS_TIMEOUT_MS:-1500}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-吃什么}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-5000}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_OPEN_PLATFORM_REALM_ID: ${WECHAT_OPEN_PLATFORM_REALM_ID:-}
      WECHAT_AUTH_TIMEOUT_MS: ${WECHAT_AUTH_TIMEOUT_MS:-2000}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_KEY: ${QQ_APP_KEY:-}
      QQ_OPEN_PLATFORM_REALM_ID: ${QQ_OPEN_PLATFORM_REALM_ID:-}
      QQ_AUTH_TIMEOUT_MS: ${QQ_AUTH_TIMEOUT_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"

  # 独立数据导出进程：不监听端口，不接收 API/auth/OAuth/管理员/HMAC Secret。
  # 本地默认关闭；生产必须把数据库角色与 OSS RAM 权限继续拆到独立实例/任务。
  export-worker:
    profiles: ["data-export"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: export-worker-runtime
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_EXPORT_WORKER_URL: postgresql://chi_shen_me:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/chi_shen_me
      DATABASE_EXPORT_WORKER_SSL_MODE: disable
      DATABASE_EXPECTED_TARGET: ${DATABASE_EXPECTED_TARGET:-}
      DATABASE_RUNTIME_ROLE_NAME: ${DATABASE_RUNTIME_ROLE_NAME:-}
      DATABASE_MIGRATION_ROLE_NAME: ${DATABASE_MIGRATION_ROLE_NAME:-}
      DATABASE_MAINTENANCE_ROLE_NAME: ${DATABASE_MAINTENANCE_ROLE_NAME:-}
      DATABASE_EXPORT_WORKER_ROLE_NAME: ${DATABASE_EXPORT_WORKER_ROLE_NAME:-}
      DATA_EXPORT_ENABLED: ${DATA_EXPORT_ENABLED:-false}
      DATA_EXPORT_OSS_REGION: ${DATA_EXPORT_OSS_REGION:-oss-cn-beijing}
      DATA_EXPORT_OSS_BUCKET: ${DATA_EXPORT_OSS_BUCKET:-}
      DATA_EXPORT_OSS_INTERNAL: ${DATA_EXPORT_OSS_INTERNAL:-true}
      DATA_EXPORT_OSS_TIMEOUT_MS: ${DATA_EXPORT_OSS_TIMEOUT_MS:-10000}
      DATA_EXPORT_CREDENTIAL_TIMEOUT_MS: ${DATA_EXPORT_CREDENTIAL_TIMEOUT_MS:-3000}
      DATA_EXPORT_MAX_ARTIFACT_BYTES: ${DATA_EXPORT_MAX_ARTIFACT_BYTES:-10485760}
      DATA_EXPORT_LOCATOR_ACTIVE_VERSION: ${DATA_EXPORT_LOCATOR_ACTIVE_VERSION:-}
      DATA_EXPORT_LOCATOR_KEYS_JSON: ${DATA_EXPORT_LOCATOR_KEYS_JSON:-}
      DATA_EXPORT_WORKER_LEASE_SECONDS: ${DATA_EXPORT_WORKER_LEASE_SECONDS:-180}
      DATA_EXPORT_WORKER_POLL_INTERVAL_MS: ${DATA_EXPORT_WORKER_POLL_INTERVAL_MS:-1000}
      SUPPORT_FEEDBACK_ENCRYPTION_ACTIVE_VERSION: ${SUPPORT_FEEDBACK_ENCRYPTION_ACTIVE_VERSION:-}
      SUPPORT_FEEDBACK_ENCRYPTION_KEYS_JSON: ${SUPPORT_FEEDBACK_ENCRYPTION_KEYS_JSON:-}
      ALIBABA_CLOUD_ECS_METADATA: ${ALIBABA_CLOUD_ECS_METADATA:-}
      ALIBABA_CLOUD_IMDSV1_DISABLED: ${ALIBABA_CLOUD_IMDSV1_DISABLED:-true}
      ALIBABA_CLOUD_ECS_IMDSV2_ENABLE: ${ALIBABA_CLOUD_ECS_IMDSV2_ENABLE:-true}
      ALIBABA_CLOUD_ECS_METADATA_DISABLED: ${ALIBABA_CLOUD_ECS_METADATA_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 仅在 `--profile admin` 且已提供独立 TLS PostgreSQL 角色和外部 Secret 时启动。
  # 该容器不加入普通 API 网络，浏览器和普通 API 都不能直接访问它。
  admin-api:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: admin-runtime
    environment:
      NODE_ENV: production
      ADMIN_API_ENABLED: "true"
      ADMIN_PORT: 3002
      ADMIN_BIND_HOST: 0.0.0.0
      # 空值会由独立管理员进程安全拒绝；不用 Compose 的 :? 插值，以免未启用
      # admin profile 时也阻断普通本地开发。
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      ADMIN_DATABASE_EXPECTED_TARGET: ${ADMIN_DATABASE_EXPECTED_TARGET:-}
      ADMIN_DATABASE_RUNTIME_ROLE_NAME: admin_api_runtime
      ADMIN_DATABASE_SSL_MODE: verify-full
      ADMIN_DATABASE_SSL_CA_BASE64: ${ADMIN_DATABASE_SSL_CA_BASE64:-}
      ADMIN_DATABASE_POOL_MAX: ${ADMIN_DATABASE_POOL_MAX:-4}
      ADMIN_DATABASE_CONNECT_TIMEOUT_MS: ${ADMIN_DATABASE_CONNECT_TIMEOUT_MS:-5000}
      ADMIN_DATABASE_IDLE_TIMEOUT_MS: ${ADMIN_DATABASE_IDLE_TIMEOUT_MS:-15000}
      ADMIN_WEBAUTHN_RP_NAME: ${ADMIN_WEBAUTHN_RP_NAME:-吃什么管理后台}
      ADMIN_WEBAUTHN_RP_ID: ${ADMIN_WEBAUTHN_RP_ID:-}
      ADMIN_WEBAUTHN_ORIGINS: ${ADMIN_WEBAUTHN_ORIGINS:-}
      ADMIN_HMAC_KEYS: ${ADMIN_HMAC_KEYS:-}
      ADMIN_CREDENTIAL_ENCRYPTION_KEYS: ${ADMIN_CREDENTIAL_ENCRYPTION_KEYS:-}
    expose:
      - "3002"
    networks:
      - admin_private
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      NODE_ENV: production
      PUBLIC_API_BASE_URL: http://api:3001
      ADMIN_API_BASE_URL: http://admin-api:3002
      ADMIN_SHARED_EDGE_RATE_LIMIT_ENABLED: ${ADMIN_SHARED_EDGE_RATE_LIMIT_ENABLED:-false}
      ADMIN_TRUSTED_CLIENT_IP_HEADER: ${ADMIN_TRUSTED_CLIENT_IP_HEADER:-}
      ADMIN_ALLOW_INSECURE_LOOPBACK: ${ADMIN_ALLOW_INSECURE_LOOPBACK:-false}
    depends_on:
      api:
        condition: service_started
      admin-api:
        condition: service_started
    networks:
      - default
      - admin_private
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

networks:
  admin_private:
    name: chi_shen_me_admin_private
